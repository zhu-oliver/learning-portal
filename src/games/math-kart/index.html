let r1=0;

function questionFor(level){
  let a,b,ans,txt;const r=n=>Math.floor(Math.random()*n)+1;
  switch(level){
    case 0:a=r(12);b=r(12);ans=a+b;txt=`${a} + ${b}`;break;
    case 1:a=r(24)+8;b=r(a);ans=a-b;txt=`${a} − ${b}`;break;
    case 2:if(Math.random()<.5){a=r(15);b=r(15);ans=a+b;txt=`${a} + ${b}`;}else{a=r(25)+5;b=r(a);ans=a-b;txt=`${a} − ${b}`;}break;
    case 3:a=r(12);b=r(12);ans=a*b;txt=`${a} × ${b}`;break;
    case 4:b=r(12);ans=r(12);a=b*ans;txt=`${a} ÷ ${b}`;break;
    case 5:{const k=Math.random();if(k<.3){a=r(12);b=r(12);ans=a*b;txt=`${a} × ${b}`;}else if(k<.5){b=r(10);ans=r(10);a=b*ans;txt=`${a} ÷ ${b}`;}else if(k<.75){a=r(18);b=r(18);ans=a+b;txt=`${a} + ${b}`;}else{a=r(25)+5;b=r(a);ans=a-b;txt=`${a} − ${b}`;}}break;
    case 6:{a=r(9);b=r(9);const c=r(9);if(Math.random()<.5){ans=(a+b)*c;txt=`(${a} + ${b}) × ${c}`;}else{ans=a*b+c;txt=`${a} × ${b} + ${c}`;}}break;
    default:{const k=Math.random();if(k<.3){a=r(12);b=r(12);ans=a*b;txt=`${a} × ${b}`;}else if(k<.5){b=r(12);ans=r(12);a=b*ans;txt=`${a} ÷ ${b}`;}else if(k<.75){a=r(9);b=r(9);const c=r(9);ans=(a+b)*c;txt=`(${a} + ${b}) × ${c}`;}else{a=r(40)+10;b=r(a);ans=a-b;txt=`${a} − ${b}`;}}
  }
  const vals=new Set([ans]);while(vals.size<4){const off=pick([-12,-10,-9,-6,-4,-3,-2,-1,1,2,3,4,6,9,10,12]);vals.add(Math.max(0,ans+off));}

const _e=new THREE.Vector3(),_dir=new THREE.Vector3(),_w=new THREE.Vector3(),_l=new THREE.Vector3();

function update(dt){
  if(mode==='menu'){menuAngle+=dt*.12;const c=startP;cams[0].position.set(c.x+Math.cos(menuAngle)*42,15,c.z+Math.sin(menuAngle)*42);cams[0].lookAt(c.x,2,c.z);updateParticles(dt);return;}

    else{cd.textContent=String(Math.ceil(countdownT));cd.classList.add('show');}

const starsKey='mathKartStars',loadStars=()=>{try{return JSON.parse(localStorage.getItem(starsKey))||[0,0,0,0,0,0,0,0];}catch{return[0,0,0,0,0,0,0,0];}};
