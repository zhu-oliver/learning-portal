 for(let i=0;i<Math.ceil(80*fxQ());i++)spawn('norm',p,{v:[(rnd()-.5)*4,3+rnd()*3.5,(rnd()-.5)*4],g:5,drag:1,life:2+rnd(),size:.13,c1:cols[i%cols.length],spin:8,floor:.02});
 for(let i=0;i<3;i++)setTimeout(()=>{const q=p.clone().add(V((rnd()-.5)*3,1.5+rnd(),(rnd()-.5)*3));sparks(q,20,3,[0xffd23f,0x7cf0ff,0xff7ae0][i]);lightFlash(q,15,0xfff0c0)},200+i*280)}

// ---------- run / flow ----------
function finish(result,instant=true){running=false;active=null;
 if(result.failure)window.portalSound?.play('bad');else if(result.win)window.portalSound?.play('win');
 if(result.failure){state='failed';showMessage(result.failure)}
 else if(result.win){state='won';const earned=countBlocks(program)<=optimal()?3:countBlocks(program)<=optimal()+2?2:1;stars[level]=Math.max(stars[level]||0,earned);localStorage.setItem('codeCommanderStars',JSON.stringify(stars));
  if(instant)showWin(earned);else{confetti();showMessage('🏁 Mission complete!');const tk=token;setTimeout(()=>{if(tk===token&&state==='won')showWin(earned)},1400)}}
 else{state='playing';showMessage('Program finished! Add more commands or reset to try a new plan.')}
 renderEditor()}
async function advance(all=false,instant=false){if(running||state!=='playing'||!program.length)return;running=true;const myToken=++token;if(!iterator)iterator=expand(program);renderEditor();let steps=0;
 while(myToken===token){const next=iterator.next();if(next.done){iterator=null;finish({},instant);return}active=next.value.path;renderEditor();const before={...tank},result=action(next.value.type);
  await animateAction(before,result,instant,myToken);if(myToken!==token)return;
  if(result.win||result.failure){iterator=null;finish(result,instant);return}
  if(++steps>=10000){iterator=null;finish({failure:'That program is too long. Try a shorter loop!'});return}
  if(!all){running=false;active=null;renderEditor();return}}}
function reset(keepProgram=true){token++;running=false;iterator=null;active=null;const cfg=levels[level];tank={x:cfg.start[0],z:cfg.start[1],dir:cfg.start[2]};enemies=clone(cfg.enemies||[]);collected=[];state='playing';$('message').style.display='none';shell.visible=false;tracers.forEach(t=>t.visible=false);syncVisual();renderEditor()}
function loadLevel(i,intro=true){if(!Number.isInteger(i)||i<0||i>=levels.length)throw Error('Invalid level');token++;level=i;$('levelLabel').innerHTML=`MISSION ${i+1} · ${levels[i].name}<small>Build a plan, then press RUN</small>`;program=[];selected=null;reset();buildBoard();renderEditor();if(intro)showIntro();else hideOverlay()}
function showCard(html,wide=false,kind='menu'){overlayKind=kind;$('card').className='card'+(wide?' wide':'');$('card').innerHTML=html;$('overlay').style.display='flex';document.querySelectorAll('.gfx').forEach(b=>b.onclick=cycleGfx)}
function hideOverlay(){$('overlay').style.display='none';overlayKind=''}
function showMenu(){state='menu';showCard(`<h1>CODE <span>COMMANDER</span></h1><p class="subtitle">Big adventures start with little commands.</p><p>🧩 Drag blocks to build a program. 🚀 Roll your tank.<br>⭐ Collect stars and reach the flag!</p><button id="play">Choose a mission</button><br><button class="secondary gfx">${gfxLabel()}</button>`,false,'menu');$('play').onclick=showLevels}
function showLevels(){let html='<h2>Choose your mission</h2><p class="subtitle">Win a mission to unlock the next one.</p><div class="levels">';for(let i=0;i<levels.length;i++){const unlocked=unlockAll||i===0||(stars[i-1]||0)>0;html+=`<button class="lvbtn" data-level="${i}" ${unlocked?'':'disabled'}><div class="num">${unlocked?i+1:'🔒'}</div><div>${levels[i].name}</div><div class="stars">${'★'.repeat(stars[i]||0)}${'☆'.repeat(3-(stars[i]||0))}</div></button>`}html+='</div><button id="back" class="secondary">Back</button>';showCard(html,true,'levels');$('card').querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>loadLevel(+b.dataset.level));$('back').onclick=showMenu}
function showIntro(){const cfg=levels[level];showCard(`<h2>Mission ${level+1}: ${cfg.name}</h2><p class="intro">${cfg.intro}</p><p>3-star goal: <b>${optimal()}</b> blocks or fewer${(cfg.stars||[]).length?' · Collect every ⭐':''}</p><button id="start">Let’s roll!</button><button id="levels" class="secondary">Missions</button>`,false,'intro');$('start').onclick=hideOverlay;$('levels').onclick=showLevels}
function showWin(earned){showCard(`<h2>Mission complete!</h2><div class="starsBig">${'★'.repeat(earned)}${'☆'.repeat(3-earned)}</div><p>You used <b>${countBlocks(program)}</b> blocks. Brilliant commanding!</p><p class="subtitle">3 stars: ${optimal()} blocks or fewer · 2 stars: ${optimal()+2} or fewer</p>${level<levels.length-1?'<button id="next">Next mission ▶</button>':''}<button id="levels" class="secondary">Missions</button><button id="again" class="secondary">Play again</button>`,false,'win');if($('next'))$('next').onclick=()=>loadLevel(level+1);$('levels').onclick=showLevels;$('again').onclick=()=>loadLevel(level)}
function showPause(){if(running){showMessage('Pause after this run, or reset when it stops.');return}showCard(`<h2>Paused</h2><p>Take your time, Commander!</p><button id="resume">Resume</button><button id="levels" class="secondary">Missions</button><br><button class="secondary gfx">${gfxLabel()}</button>`,false,'pause');$('resume').onclick=hideOverlay;$('levels').onclick=showLevels}
$('run').onclick=()=>advance(true);$('step').onclick=()=>advance(false);$('reset').onclick=()=>reset();$('hint').onclick=()=>showMessage(levels[level].hint);$('pause').onclick=showPause;

// ---------- frame loop ----------
let last=performance.now(),time=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
 waterTex.offset.x+=dt*.035;waterTex.offset.y+=dt*.02;
 if(goalObj){const c=goalObj.cloth,pa=c.geometry.attributes.position,b=c.userData.base;for(let i=0;i<pa.count;i++){const x=b[i*3];pa.setZ(i,Math.sin(x*8-time*5)*x*.16);pa.setY(i,b[i*3+1]-x*x*.08+Math.sin(x*6-time*4)*.012)}pa.needsUpdate=true;c.geometry.computeVertexNormals();
  goalObj.pad.scale.setScalar(1+.1*Math.sin(time*3));}
 M.pad.opacity=.65+.25*Math.sin(time*3);M.threat.opacity=.6+.25*Math.sin(time*4);
 for(const s of starMeshes){s.star.rotation.y+=dt*1.6;s.star.position.y=.55+Math.sin(time*2.2+s.x)*.06}
 for(const e of enemyMeshes){if(e.alive.visible&&tankMesh){const dx=tankMesh.position.x-e.g.position.x,dz=tankMesh.position.z-e.g.position.z,want=Math.atan2(-dx,-dz);let d=want-e.gun.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));e.gun.rotation.y+=d*Math.min(1,dt*4)}
  else if(e.rubble.visible){e.smoke-=dt;if(e.smoke<=0){e.smoke=(gfxLow?.8:.4)+rnd()*.3;smoke(e.g.position.clone().setY(.15),1,.6)}}}
 updateParticles(dt);updateDebris(dt);
 if(swT>0){swT-=dt*2.4;const s=.4+(1-swT)*1.6;shockwave.scale.setScalar(s);shockwave.material.opacity=Math.max(0,swT)*.8;if(swT<=0)shockwave.visible=false}
 flashI*=Math.exp(-dt*9);flash.intensity=flashI<.05?0:flashI;
 shake=Math.max(0,shake-dt*1.3);placeCamera();autoScroll();
 renderer.render(scene,camera);
 if(gfxMode==='auto'&&!gfxLow&&state==='playing'&&!document.hidden){if(!fpsStart)fpsStart=now;fpsFrames++;if(now-fpsStart>4000){if(fpsFrames*1000/(now-fpsStart)<35){applyGfx(true);showMessage('Graphics lowered for smoother play.')}fpsStart=now;fpsFrames=0}}}
requestAnimationFrame(frame);
loadLevel(0,false);showMenu();
window.__game={get state(){return state},get level(){return level+1},get grid(){return clone({size,walls:levels[level].walls,water:levels[level].water,enemies,stars:levels[level].stars||[],goal:levels[level].goal})},get tank(){return {...tank}},get program(){return clone(program)},get solutions(){return levels.map(l=>clone(l.solution))},get referenceSolutions(){return levels.map(l=>clone(l.solution))},get blockLimit(){return MAX_BLOCKS},get starTarget(){return optimal()},get blockCount(){return countBlocks(program)},get gfx(){return {mode:gfxMode,low:gfxLow,weakHw}},setGfx,setProgram,run:(options={})=>advance(true,!!options.instant),step:(options={})=>advance(false,!!options.instant),reset,loadLevel:(n)=>loadLevel(n-1,false),unlockAll:(on=true)=>{unlockAll=!!on;if(overlayKind==='levels')showLevels()},showLevels};
</script></body></html>
