function clearRound(){for(const o of active.slice())removeObj(o);active=[];locked=null;endT=-1;$('banner').style.display='none'}
function resetStats(){lives=MAXLIVES;score=0;combo=0;bestCombo=0;correct=0;wrong=0;slices=0;misses=0;spawned=0;spawnT=.2;playTime=0;endT=-1;bag=[];hudDirty=true}
function begin(){hide();clearRound();resetStats();total=survival?Infinity:L.count;state='ready';introT=1.6;banner('Ready…');sfx.gong();updateHUD();setHint(null)}
function startSurvival(){survival=true;L={kind:'mixed',name:'Survival',icon:'♾️'};li=-1;begin()}
function banner(t){const b=$('banner');b.textContent=t;b.style.display='block'}
function computeStars(){const a=accP();return misses===0&&a>=95?3:misses<=2&&a>=85?2:1}
function win(){state='win';sfx.win();const n=computeStars();if(n>(stars[li]||0)){stars[li]=n;localStorage.setItem(LS+'Stars',JSON.stringify(stars))}setHint(null);
 for(let k=0;k<6;k++)setTimeout(()=>emit(new THREE.Vector3(rnd(-4,4),rnd(2,5),rnd(-6,-2)),pick([[1,.85,.2],[1,.4,.5],[.5,.9,1],[.6,1,.5]]),30,6,.14,1.4,-6),k*160);
 const last=li>=LEVELS.length-1;
 show(`<h2>🎉 Level Complete!</h2><div class="big">${starStr(n)}</div><div class="stats"><div>⚡ ${wpm()} WPM</div><div>🎯 ${accP()}% accuracy</div><div>🔥 Best combo ${bestCombo}</div><div>⭐ ${score} pts</div><div>💔 ${misses} missed</div></div>
 <div class="lesson">💡 <b>Did you know?</b> ${FACTS[li%FACTS.length]}</div>${n<3?`<p class="sub" style="font-size:13px">Tip: ${misses?'Slice the closest targets first (red border = almost here!).':'Slow down a little to make fewer wrong keys — accuracy first, speed later!'}</p>`:''}
 <div class="row2">${last?'<button data-a="surv" class="gold">♾️ Try Survival!</button>':'<button data-a="next" class="gold">▶ Next Level</button>'}<button data-a="retry">🔁 Replay</button><button data-a="levels" class="sec">🏯 Levels</button></div>`)}
function lose(){state='fail';sfx.fail();setHint(null);for(const o of active.slice())removeObj(o);
 if(survival){const nb=score>best;if(nb){best=score;localStorage.setItem(LS+'Best',best)}
  show(`<h2>♾️ Survival Over</h2><p class="sub">${nb?'🏆 <b>New best score!</b>':'Best: '+best}</p><div class="stats"><div>⭐ ${score} pts</div><div>🗡️ ${slices} sliced</div><div>⚡ ${wpm()} WPM</div><div>🎯 ${accP()}%</div><div>🔥 ${bestCombo} combo</div></div>
  <div class="lesson">💡 <b>Did you know?</b> ${pick(FACTS)}</div><div class="row2"><button data-a="retry" class="gold">🔁 Again</button><button data-a="levels" class="sec">🏯 Levels</button></div>`);return}
 show(`<h2>💥 Out of hearts!</h2><p class="sub">You sliced ${slices} of ${total}. Every ninja falls before they fly!</p><div class="stats"><div>⚡ ${wpm()} WPM</div><div>🎯 ${accP()}%</div></div>
 <div class="lesson">🎓 <b>Lesson:</b> ${L.lesson}<br><br>💡 Tip: type the target with the <b>red border</b> first — it is closest to you!</div>
 <div class="row2"><button data-a="retry" class="gold">🔁 Try Again</button><button data-a="levels" class="sec">🏯 Levels</button></div>`)}
let pausedFrom=null;
function pause(){if(state!=='play'&&state!=='ready')return;pausedFrom=state;state='paused';show(`<h2>⏸ Paused</h2><p class="sub">Take a breath, ninja. Fingers back on home row!</p><div class="row2"><button data-a="resume" class="gold">▶ Resume</button><button data-a="retry">🔁 Restart</button><button data-a="levels" class="sec">🏯 Levels</button></div>`)}
function resume(){if(state!=='paused')return;hide();state=pausedFrom||'play'}
// ---------- events ----------
addEventListener('keydown',e=>{ac();if(e.getModifierState&&$('caps'))$('caps').style.display=e.getModifierState('CapsLock')&&state==='play'?'block':'none';
 if(e.key==='Escape'){e.preventDefault();state==='paused'?resume():pause();return}
 if(state!=='play'){if(e.key==='Enter'&&!overlay.classList.contains('hide')){const b=card.querySelector('button.gold')||card.querySelector('button');if(b){e.preventDefault();b.click()}}return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.key.length!==1)return;e.preventDefault();inputChar(e.key)});
$('pauseBtn').onclick=()=>{sfx.click();state==='paused'?resume():pause()};
$('muteBtn').onclick=()=>{muted=!muted;localStorage.setItem(LS+'Mute',muted?'1':'0');$('muteBtn').textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:.8};
$('gfxBtn').onclick=()=>{const m=gfxModes[(gfxModes.indexOf(gfxMode)+1)%3];localStorage.setItem(LS+'Gfx',m);location.reload()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
addEventListener('resize',()=>{resize();for(const o of active)o.w=0});
// ---------- loop ----------
const clock=new THREE.Clock();let T=0;
function step(dt){T+=dt;
 if(state==='ready'&&introT>0){introT-=dt;if(introT<.5&&$('banner').textContent!=='Go!'){banner('Go!');sfx.go()}if(introT<=0){$('banner').style.display='none';state='play';refreshHint()}}
 if(state==='play'){playTime+=dt;spawnT-=dt;const max=survival?2+Math.min(2,Math.floor(slices/20)):L.max;const gap=survival?Math.max(1.1,2.5-slices*.02):L.gap;
  if(spawned<total&&active.length<max&&(spawnT<=0||active.length===0)){if(spawn())spawnT=gap}
  updateObjs(dt,T);if(state==='play'&&!survival&&spawned>=total&&active.length===0){if(endT<0)endT=.9;endT-=dt;if(endT<=0)win()}
  hudT-=dt;if(hudT<=0){hudT=.25;hudDirty=true}if(hudDirty){hudDirty=false;updateHUD()}if(!locked)refreshHint()}
 updateParts(dt);updatePetals(dt,T);updateKatana(dt,T);updateStreaks(dt);updatePieces(dt);
 shakeT=Math.max(0,shakeT-dt);camera.position.set(CAM.x+Math.sin(T*.4)*.12+(shakeT?rnd(-1,1)*shakeT*.5:0),CAM.y+Math.sin(T*.6)*.06+(shakeT?rnd(-1,1)*shakeT*.4:0),CAM.z);camera.lookAt(LOOK);}
function frame(){requestAnimationFrame(frame);const dt=Math.min(.05,clock.getDelta());step(dt);if(state==='play'||active.length)updateLabels();renderer.render(scene,camera)}
// ---------- test API ----------
window.__game={get state(){return state},get level(){return survival?0:li+1},get lives(){return lives},get score(){return score},get stats(){return{slices,misses,correct,wrong,combo,bestCombo,wpm:wpm(),acc:accP(),spawned,total,stars:survival?0:computeStars()}},
 get targets(){return active.map(o=>({label:o.label,typed:o.typed,t:+o.t.toFixed(3),locked:o.locked,kind:o.kind}))},get stars(){return stars.slice()},get low(){return LOW},levels:LEVELS.map(l=>l.name),
 loadLevel(n){intro(n-1);begin();introT=0.01;return state},survival(){startSurvival();introT=.01},typeChar:inputChar,typeText(s){for(const c of s)inputChar(c)},
 sliceNext(){let o=locked;if(!o)for(const a of active)if(!o||a.t>o.t)o=a;if(!o)return null;const l=o.label;for(const c of l.slice(o.typed))inputChar(c);return l},
 fastForward(sec,auto=false){let n=Math.round(sec*60);while(n-->0){if(auto&&state==='play'&&active.length){const o=active.reduce((a,b)=>a.t>b.t?a:b);if(o.t>.5)this.sliceNext()}step(1/60)}return state},
 unlockAll(){unlockAllFlag=true},resetProgress(){stars=[];best=0;localStorage.removeItem(LS+'Stars');localStorage.removeItem(LS+'Best')},showLevels,showTitle,pause,resume};
buildKeyboard();setHint(null);resize();showTitle();frame();
</script></body></html>
