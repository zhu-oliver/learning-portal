<!DOCTYPE html>

<style>
  * { box-sizing: border-box; }

  #stats { position: absolute; top: 14px; left: 12px; display: flex; flex-direction: column; gap: 3px; font-size: 17px; font-weight: 700; background: rgba(0,0,0,.35); padding: 10px 14px; border-radius: 12px; }

  #eqBox { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); text-align: center; background: rgba(20,30,60,.8); padding: 8px 28px 12px; border-radius: 16px; border: 3px solid #ffd23f; display: none; }
  #eqBox.boss { border-color: #5dff8a; top: auto; bottom: 52px; }
  #eqLabel { font-size: 14px; opacity: .85; }
  #eqText { font-size: 44px; font-weight: 900; color: #ffd23f; letter-spacing: 1px; white-space: nowrap; }
  #toast { position: absolute; top: 28%; left: 50%; transform: translate(-50%, -50%); font-size: 54px; font-weight: 900; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  #help { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 14px; opacity: .85; background: rgba(0,0,0,.3); padding: 6px 12px; border-radius: 8px; white-space: nowrap; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; transform: translate(-50%, -100%); padding: 2px 10px; border-radius: 10px; font-weight: 900; font-size: 18px; color: #fff; border: 2px solid #fff; white-space: nowrap; }
  .lbl.army { background: #2f6fe0; font-size: 22px; }
  .lbl.enemy { background: #d0302a; }

  #weapon { color: #ffe27a; }
  .lbl.ball { background: #fff; color: #1d2433; border: 3px solid #2fbf5a; font-size: 24px; padding: 0 10px; }
  .bossbar { position: absolute; transform: translate(-50%, -100%); width: 240px; text-align: center; display: none; }
  .bossbar .name { font-weight: 900; font-size: 17px; color: #fff; margin-bottom: 3px; }
  .bossbar .bar { height: 16px; background: rgba(0,0,0,.55); border: 2px solid #fff; border-radius: 9px; overflow: hidden; }
  .bossbar .fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff3b2f, #ff9a3c); transition: width .1s; }
  .float { position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 36px; animation: floatUp 1.2s ease-out forwards; text-shadow: 0 2px 6px rgba(0,0,0,.7); white-space: nowrap; }

  .card { background: #fff; color: #1d2433; border-radius: 20px; padding: 22px 30px; max-width: 500px; width: 94%; max-height: 96vh; overflow-y: auto; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
  .card.wide { max-width: 680px; }
  .card h1 { margin: 0 0 6px; font-size: 42px; color: #2f6fe0; letter-spacing: 2px; }
  .card h1 span { color: #e0392f; }
  .card h2 { margin: 0 0 8px; font-size: 20px; color: #1d2433; }
  .card p { margin: 5px 0; line-height: 1.4; }
  .card ul { text-align: left; margin: 8px 0 10px; padding-left: 22px; line-height: 1.45; font-size: 15px; }
  .card button { margin-top: 12px; font-size: 22px; font-weight: 800; padding: 11px 32px; border: none; border-radius: 14px; background: #ffd23f; color: #1d2433; cursor: pointer; box-shadow: 0 5px 0 #c9a21d; }
  .card button:active { transform: translateY(3px); box-shadow: 0 2px 0 #c9a21d; }
  .card button.secondary { background: #e8edf5; box-shadow: 0 5px 0 #b9c2d0; }
  .btnrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .big { font-size: 22px; font-weight: 800; }
  .starsBig { font-size: 44px; color: #f0a500; letter-spacing: 4px; }
  .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin: 10px 0 4px; }
  @media (max-width: 560px) { .levels { grid-template-columns: repeat(2, 1fr); } }
  .card button.lvbtn { margin: 0; padding: 8px 6px 6px; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 1px; background: #e8edf5; box-shadow: 0 4px 0 #b9c2d0; border: 3px solid transparent; }
  .card button.lvbtn:hover { background: #dbe6fb; }
  .card button.lvbtn.last { border-color: #2f6fe0; }
  .card button.gfx { font-size: 15px; padding: 7px 18px; margin-top: 10px; }
  .lvbtn .num { font-size: 28px; font-weight: 900; color: #2f6fe0; line-height: 1; }
  .lvbtn .nm { font-size: 12px; font-weight: 700; line-height: 1.15; min-height: 28px; display: flex; align-items: center; }
  .lvbtn .ops { font-size: 15px; font-weight: 900; color: #e0392f; }
  .lvbtn .stars { font-size: 15px; color: #f0a500; letter-spacing: 1px; }
  #flash { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(transparent 55%, rgba(255,0,0,.5)); opacity: 0; transition: opacity .15s; }

<script type="module">
const localStorage = window.portalGameProgress;
import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const shuffle = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

const ROAD_HALF = 8;
const SEG = 80;              // distance between gate rows
const MAX_DRAW = 350;        // max soldiers rendered per squad/army
const SPACING = 0.42;
const MAX_ARMY = 999;
const BASE_SPEED = 7;
const RUN_TIME = 85;         // seconds of marching before the boss (boss fight adds ~35s)
const RAMP = 0.3;            // pace grows by 30% over the course of a level
const ARENA_LEN = 36;        // boss stands this far past the arena entrance
const RUN_HELP = '◀ ▶ / A D / drag to move  •  hold ▲ / W to hurry  •  P to pause';
const BOSS_HELP = '◀ ▶ ▲ ▼ / W A S D / drag to move  •  grab the ball with the answer!';

// weapon tiers; picked up from crates dropped by bunkers and tanks. rate = seconds between volleys
const WEAPONS = [
  { name: 'Rifle',       icon: '🔫', dmg: 1, rate: 0.28, speed: 42, color: 0xfff25a, sw: 1,   len: 1 },
  { name: 'Machine Gun', icon: '💥', dmg: 1, rate: 0.14, speed: 46, color: 0xffb020, sw: 0.9, len: 1.6 },
  { name: 'Sniper',      icon: '🎯', dmg: 2, rate: 0.28, speed: 70, color: 0xffffff, sw: 0.7, len: 4 },
  { name: 'RPG',         icon: '🚀', dmg: 3, rate: 0.28, speed: 34, color: 0xff5a1a, sw: 1.9, len: 2.2 },
  { name: 'Laser',       icon: '⚡', dmg: 4, rate: 0.28, speed: 80, color: 0x3df5ff, sw: 0.8, len: 6 },
];
const wDps = (w) => w.dmg * 0.28 / w.rate;

const LEVELS = [
  { name: 'Addition Avenue',      ops: ['add'],                           k: 1,  boss: 'Captain Carry',     sky: 0x9fd3ff, grass: 0x6ab04c, color: 0xd0302a },
  { name: 'Subtraction Street',   ops: ['add', 'sub', 'sub'],             k: 2,  boss: 'Sergeant Subtract', sky: 0xb5e3ff, grass: 0x7fbf55, color: 0xc2410c },
  { name: 'Times Table Trail',    ops: ['mul'],                           k: 2,  boss: 'General Times',     sky: 0xffd9a8, grass: 0x8fb34a, color: 0x9d174d },
  { name: 'Mixed Meadow',         ops: ['add', 'sub', 'mul', 'mul'],      k: 4,  boss: 'Major Mixup',       sky: 0xc8f0d8, grass: 0x4fa85a, color: 0x7c2d12 },
  { name: 'Division Desert',      ops: ['div', 'div', 'mul'],             k: 5,  boss: 'Duke Divide',       sky: 0xffe7b0, grass: 0xd8b86a, color: 0x92400e },
  { name: 'Big Times Canyon',     ops: ['mul'],                           k: 9,  boss: 'Baron Big-Times',   sky: 0xf6c1a0, grass: 0xb9774a, color: 0x7f1d1d },
  { name: 'Multi-Step Mountain',  ops: ['mix', 'mix', 'mul', 'div'],      k: 7,  boss: 'Warlord Multistep', sky: 0xb9c6e6, grass: 0x5d8a6a, color: 0x581c87 },
  { name: 'Math Master Fortress', ops: ['mul', 'div', 'mix', 'mix', 'sub'], k: 10, boss: 'Emperor Equation', sky: 0x8d97b5, grass: 0x4b5a4f, color: 0x111827 },
];
const OP_SYM = { add: '+', sub: '−', mul: '×', div: '÷', mix: '2-step' };
const opsLabel = (ops) => [...new Set(ops)].map((o) => OP_SYM[o]).join(' ');
const starStr = (n) => '★'.repeat(n) + '☆'.repeat(3 - n);

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9fd3ff, 60, 150);
scene.environmentIntensity = 0.55;
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 320);

const hemi = new THREE.HemisphereLight(0xdfefff, 0x4a5a3a, 0.7);
scene.add(hemi);
// sun comes from the upper left, slightly behind the camera
const SUN_OFF = new THREE.Vector3(-22, 40, 10);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 50, bottom: -50, near: 1, far: 130 });
scene.add(sun, sun.target);

// gradient sky dome; horizon colour matches the fog so distant objects melt into it
const skyU = { uTop: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uSun: { value: SUN_OFF.clone().normalize() } };
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vDir; void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 uTop; uniform vec3 uHor; uniform vec3 uSun; varying vec3 vDir;
    void main() {
      vec3 d = normalize(vDir);
      vec3 c = mix(uHor, uTop, pow(clamp(d.y, 0.0, 1.0), 0.6));
      float s = max(dot(d, uSun), 0.0);
      c += vec3(1.0, 0.9, 0.7) * (pow(s, 900.0) * 6.0 + pow(s, 10.0) * 0.18);
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), skyMat);
sky.frustumCulled = false; sky.renderOrder = -1;
scene.add(sky);

// environment map (sky + ground bounce) for soft reflections on metal and paint
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), skyMat));
const envGround = new THREE.Mesh(new THREE.CircleGeometry(9.5, 24), new THREE.MeshBasicMaterial({ color: 0x556644 }));
envGround.rotation.x = -Math.PI / 2; envGround.position.y = -1; envScene.add(envGround);
let envRT = null;
function setSky(skyHex, groundHex) {
  const hor = new THREE.Color(skyHex);
  skyU.uHor.value.copy(hor);
  skyU.uTop.value.copy(hor).offsetHSL(0.02, 0.15, -0.25);
  scene.fog.color.copy(hor);
  hemi.color.copy(hor).lerp(new THREE.Color(0xffffff), 0.7);
  hemi.groundColor.setHex(groundHex).multiplyScalar(0.6);
  envGround.material.color.setHex(groundHex);
  if (envRT) envRT.dispose();
  envRT = pmrem.fromScene(envScene, 0.03);
  scene.environment = envRT.texture;
}

// ---------- procedural textures ----------
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function speckle(g, w, h, n, cols, smin, smax, alpha) {
  for (let i = 0; i < n; i++) {
    g.globalAlpha = alpha * Math.random(); g.fillStyle = pick(cols);
    const s = rand(smin, smax); g.fillRect(Math.random() * w, Math.random() * h, s, s);
  }
  g.globalAlpha = 1;
}
// soft blobs drawn with wrap-around so the texture tiles seamlessly
function blotches(g, w, h, n, cols, rmin, rmax, alpha) {
  for (let i = 0; i < n; i++) {
    const x = Math.random() * w, y = Math.random() * h, r = rand(rmin, rmax), sq = rand(0.5, 1), a = rand(0, 3.14);
    g.globalAlpha = alpha; g.fillStyle = pick(cols);
    for (const ox of [-w, 0, w]) for (const oy of [-h, 0, h]) {
      g.beginPath(); g.ellipse(x + ox, y + oy, r, r * sq, a, 0, Math.PI * 2); g.fill();
    }
  }
  g.globalAlpha = 1;
}
const ROAD_TILE = 12;
// asphalt: 16 m wide x 12 m long, 64 px per metre
const roadTex = canvasTex(1024, 768, (g, w, h) => {
  g.fillStyle = '#4a4d52'; g.fillRect(0, 0, w, h);
  blotches(g, w, h, 70, ['#3f4247', '#55585d', '#45484d', '#4e5156'], 20, 90, 0.35);
  // tyre wear down the middle of each lane
  g.fillStyle = 'rgba(25,25,28,.13)';
  for (const lc of [w / 6, w / 2, (5 * w) / 6]) for (const o of [-0.05, 0.05]) g.fillRect(lc + o * w - 16, 0, 32, h);
  // painted lines
  g.fillStyle = '#e9e6dc';
  g.fillRect(18, 0, 13, h); g.fillRect(w - 31, 0, 13, h);
  for (const lx of [w / 3, (2 * w) / 3]) { g.fillRect(lx - 6, 60, 12, 250); g.fillRect(lx - 6, 444, 12, 250); }
  speckle(g, w, h, 30000, ['#2c2e32', '#6a6d72', '#82858a', '#3a3c40', '#575a5f'], 1, 3, 0.85);
  // cracks
  g.strokeStyle = '#26272a'; g.lineWidth = 1.6; g.globalAlpha = 0.75;
  for (let k = 0; k < 9; k++) {
    let x = Math.random() * w, y = Math.random() * h, a = rand(0, 6.28);
    g.beginPath(); g.moveTo(x, y);
    for (let s = 0; s < randi(12, 30); s++) { a += rand(-0.7, 0.7); x += Math.cos(a) * rand(6, 16); y += Math.sin(a) * rand(6, 16); g.lineTo(x, y); }
    g.stroke();
  }
  g.globalAlpha = 1;
  blotches(g, w, h, 5, ['#232427'], 12, 38, 0.22);
});
const grassTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#d4d6c8'; g.fillRect(0, 0, w, h);
  blotches(g, w, h, 60, ['#bfc4ac', '#e6e8da', '#aeb39c', '#c9c2a6'], 20, 80, 0.45);
  g.lineWidth = 1.4;
  for (let i = 0; i < 14000; i++) {
    const x = Math.random() * w, y = Math.random() * h, l = rand(3, 9), a = -Math.PI / 2 + rand(-0.6, 0.6);
    g.strokeStyle = pick(['#a3ab8a', '#e2e6cc', '#c3c8ad', '#8f957a', '#d8d0a8']); g.globalAlpha = rand(0.3, 0.8);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  g.globalAlpha = 1;
});
const dirtTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#9a8c72'; g.fillRect(0, 0, w, h);
  blotches(g, w, h, 30, ['#8a7c62', '#ab9d82', '#7d725c'], 10, 40, 0.5);
  speckle(g, w, h, 9000, ['#5f574a', '#c8bca2', '#776d5c', '#b0a68e'], 1, 4, 0.9);
});

// ---------- environment ----------
const ROAD_LEN = 300;
roadTex.repeat.set(1, ROAD_LEN / ROAD_TILE);
grassTex.repeat.set(220 / 6, ROAD_LEN / 6);
dirtTex.repeat.set(1, ROAD_LEN / 3);
const roadGroup = new THREE.Group();
const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_HALF * 2, ROAD_LEN),
  new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.93, bumpMap: roadTex, bumpScale: 0.8 }));
road.rotation.x = -Math.PI / 2; road.receiveShadow = true;
roadGroup.add(road);
const curbGeo = new THREE.BoxGeometry(0.4, 0.22, ROAD_LEN);
const curbMat = new THREE.MeshStandardMaterial({ color: 0xb4b2aa, roughness: 0.85 });
const shoulderMat = new THREE.MeshStandardMaterial({ map: dirtTex, roughness: 1 });
for (const s of [-1, 1]) {
  const c = new THREE.Mesh(curbGeo, curbMat); c.position.set(s * (ROAD_HALF + 0.2), 0.11, 0); c.receiveShadow = c.castShadow = true; roadGroup.add(c);
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(2.2, ROAD_LEN), shoulderMat);
  sh.rotation.x = -Math.PI / 2; sh.position.set(s * (ROAD_HALF + 1.5), 0.005, 0); sh.receiveShadow = true; roadGroup.add(sh);
}
const grassMat = new THREE.MeshStandardMaterial({ color: 0x6ab04c, map: grassTex, roughness: 1 });
const grass = new THREE.Mesh(new THREE.PlaneGeometry(220, ROAD_LEN), grassMat);
grass.rotation.x = -Math.PI / 2; grass.position.y = -0.02; grass.receiveShadow = true;
roadGroup.add(grass);
scene.add(roadGroup);

// organic shapes: weld vertices, then nudge them randomly
function lumpy(geo, amt) {
  geo.deleteAttribute('normal'); geo.deleteAttribute('uv');
  geo = mergeVertices(geo);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) + rand(-amt, amt), p.getY(i) + rand(-amt, amt) * 0.6, p.getZ(i) + rand(-amt, amt));
  geo.computeVertexNormals();
  return geo;
}
function makePineGeo() {
  const tiers = [[1.6, 2.3, 1.9], [1.25, 2.0, 2.95], [0.9, 1.7, 3.85], [0.55, 1.4, 4.65]];
  return mergeGeometries(tiers.map(([r, hgt, y]) => { const c = lumpy(new THREE.ConeGeometry(r, hgt, 10, 2), 0.13); c.translate(0, y, 0); return c; }));
}
function makeCanopyGeo(n, y, spread, rmin, rmax) {
  const parts = [];
  for (let k = 0; k < n; k++) {
    const b = lumpy(new THREE.IcosahedronGeometry(rand(rmin, rmax), 1), 0.12);
    b.translate(rand(-spread, spread), y + rand(-spread, spread) * 0.6, rand(-spread, spread)); parts.push(b);
  }
  return mergeGeometries(parts);
}
const pineGeos = [makePineGeo(), makePineGeo(), makePineGeo()];
const leafyGeos = [makeCanopyGeo(5, 3.4, 0.9, 0.9, 1.3), makeCanopyGeo(4, 3.0, 0.8, 0.8, 1.2)];
const bushGeos = [makeCanopyGeo(3, 0.45, 0.45, 0.45, 0.7), makeCanopyGeo(4, 0.4, 0.55, 0.4, 0.65)];
const pineTrunkGeo = new THREE.CylinderGeometry(0.13, 0.22, 2.0, 7); pineTrunkGeo.translate(0, 1.0, 0);

// ---------- math problems ----------
function makeProblem(ops, k) {
  const t = pick(ops);
  const m = Math.min(12, Math.round(3 + k));
  let a, b, c, ans, text; const extra = [];
  switch (t) {
    case 'add': a = randi(1, 5 + k * 4); b = randi(1, 5 + k * 4); ans = a + b; text = `${a} + ${b}`; extra.push(a + b + 10, Math.abs(a - b)); break;
    case 'sub': a = randi(6, 12 + k * 4); b = randi(1, a); ans = a - b; text = `${a} − ${b}`; extra.push(a + b); break;
    case 'mul': a = randi(2, m); b = randi(2, m); ans = a * b; text = `${a} × ${b}`; extra.push(a * (b + 1), a * (b - 1), a + b, (a + 1) * b); break;
    case 'div': b = randi(2, m); ans = randi(2, m); a = b * ans; text = `${a} ÷ ${b}`; extra.push(ans + b, a - b, ans * 2); break;
    case 'mix':
      a = randi(2, 9); b = randi(2, 9);
      if (Math.random() < 0.5) { c = randi(1, 20); ans = a * b + c; text = `${a} × ${b} + ${c}`; extra.push(a * (b + c), a + b + c); }
      else { c = randi(1, a * b - 1); ans = a * b - c; text = `${a} × ${b} − ${c}`; extra.push(a * b + c, a * (b - c)); }
      break;
  }
  const cands = shuffle([ans + 1, ans - 1, ans + 2, ans - 2, ans + 10, ans - 10, ans + randi(3, 6), ans - randi(3, 6), ...extra, ...extra]);
  const wrong = [];
  for (const w of cands) if (w >= 0 && w !== ans && !wrong.includes(w)) { wrong.push(w); if (wrong.length >= 3) break; }
  for (let d = 3; wrong.length < 3; d++) if (!wrong.includes(ans + d)) wrong.push(ans + d);
  return { text, ans, wrong };
}

      tx = rand(-ROAD_HALF + 1, ROAD_HALF - 1); tz = rand(bossZ + 11, runEnd + 1); tries++;
    } while (tries < 60 && (spots.some((s) => Math.hypot(s[0] - tx, s[1] - tz) < 3.4) || Math.hypot(tx - px, tz - pz) < 3.5));
    spots.push([tx, tz]);
    const mesh = new THREE.Group();
    const ball = new THREE.Mesh(ballGeo, ballMat); ball.castShadow = true;
    const band = new THREE.Mesh(bandGeo, bandMat); band.rotation.x = Math.PI / 2;
    mesh.add(ball, band); mesh.visible = false; scene.add(mesh);
    const el = document.createElement('div'); el.className = 'lbl ball'; el.textContent = val; el.style.display = 'none'; labelsEl.appendChild(el);
    balls.push({ val, correct: val === p.ans, wave: wave.id, sx: bossX, sz: bossZ + 1.5, tx, tz, x: bossX, y: 5, z: bossZ, t: -i * 0.3, dur: 1.1, landed: false, mesh, el });
  });
}
function bossDefeated() {
  phase = 'victory'; winT = 2;
  for (let k = 0; k < 8; k++) burst(bossX + rand(-2, 2), rand(1, 6), bossZ + rand(-1, 1), k % 2 ? cYellow : cRed, 30, 8);
  boss.visible = false; eBul = []; wave = null;
  clearBalls(true);
  toast('🏆 BOSS DEFEATED!', '#ffd23f');
}

// ---------- input ----------
const keys = {};
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code.startsWith('Arrow')) e.preventDefault();
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'Enter' || e.code === 'Space') {
    if (state === 'menu' || state === 'over') startLevel(lastLevel);
    else if (state === 'win') startLevel(Math.min(L + 1, LEVELS.length - 1));
  }
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
let dragging = false, lastX = 0, lastY = 0, dragDX = 0, dragDZ = 0, dragBoostT = 0, boost = 1;
const BOOST = 1.9;
renderer.domElement.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  dragDX += ((e.clientX - lastX) / innerWidth) * 26;
  dragDZ += ((e.clientY - lastY) / innerHeight) * 34;
  lastX = e.clientX; lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointercancel', () => { dragging = false; });

// ---------- menus ----------

  const card = $('card');

  $('overlay').classList.add('show');
  card.querySelectorAll('[data-act]').forEach((b) => {
    b.onclick = () => {
      const a = b.dataset.act;
      if (a === 'level') startLevel(+b.dataset.i);
      else if (a === 'retry') startLevel(L);
      else if (a === 'next') startLevel(L + 1);
      else if (a === 'menu') { state = 'menu'; resetLevel(L); showMenu(); }

      else if (a === 'gfx') { setGfxMode(GFX_MODES[(GFX_MODES.indexOf(gfxMode) + 1) % 3]); b.textContent = gfxLabel(); }
    };
  });
}

function showGameOver() {

  const where = phase === 'run'
    ? `Fell at ${Math.round(progress * 100)}% of the march`

  const s = acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : 1;

  const mins = Math.floor(levelTime / 60), secs = String(Math.floor(levelTime % 60)).padStart(2, '0');

    <div class="btnrow">
      ${hasNext ? `<button data-act="next">NEXT LEVEL ▶</button>` : `<button data-act="menu">🏆 ALL CLEAR!</button>`}

function startLevel(i) {
  resetLevel(i);
  state = 'play';
  $('overlay').classList.remove('show');
}
function togglePause() {
  if (state === 'play') {
    state = 'paused';
    setCard(`<h1>PAUSED</h1><h2>Level ${L + 1}: ${cfg.name}</h2>
      <div class="btnrow"><button data-act="resume">RESUME</button><button class="secondary" data-act="menu">QUIT</button></div>

  } else if (state === 'paused') {
    state = 'play'; $('overlay').classList.remove('show');
  }
}

// ---------- update ----------
function update(dt) {
  time += dt; levelTime += dt;
  if (phase === 'run') {
    progress = clamp(pz / runEnd, 0, 1);
    speed = v0 * (1 + RAMP * progress);
    eL = 1 + L * 0.8 + progress;
  }

  // movement: forced march during the run, free 2D movement in the boss arena
  let mx = 0, mz = 0;
  if (keys.ArrowLeft || keys.KeyA) mx -= 1;
  if (keys.ArrowRight || keys.KeyD) mx += 1;
  if (keys.ArrowUp || keys.KeyW) mz -= 1;
  if (keys.ArrowDown || keys.KeyS) mz += 1;
  px += mx * (12 + (speed - BASE_SPEED) * 0.6) * dt + dragDX; dragDX = 0;
  px = clamp(px, -ROAD_HALF + 0.5, ROAD_HALF - 0.5);
  if (phase === 'run') {
    // hold ▲ / W (or swipe up) to march faster; eases in and out smoothly
    if (dragDZ < -0.05) dragBoostT = 0.25;
    dragBoostT = Math.max(0, dragBoostT - dt);
    const wantBoost = mz < 0 || dragBoostT > 0;
    boost += ((wantBoost ? BOOST : 1) - boost) * Math.min(1, dt * 4);
    speed *= boost;
    pz -= speed * dt; dragDZ = 0;
    if (pz <= runEnd) startBoss();
  } else {
    pz += mz * 10 * dt + dragDZ; dragDZ = 0;
    pz = clamp(pz, bossZ + 10, runEnd + 3);
  }
  const armyR = radiusFor(count);
  const pickR = clamp(armyR * 0.45, 0.9, 1.8);

  if (phase === 'run') fillSegments();

  // army soldier positions
  const drawN = Math.min(count, MAX_DRAW);
  const k = Math.min(1, dt * 6);
  for (let i = 0; i < drawN; i++) {
    offX[i] += (FORM[i][0] - offX[i]) * k;
    offZ[i] += (FORM[i][1] - offZ[i]) * k;
    sx[i] = clamp(px + offX[i], -ROAD_HALF + 0.3, ROAD_HALF - 0.3);
    sz[i] = pz + offZ[i];
  }
  for (let i = drawN; i < MAX_DRAW; i++) { offX[i] = 0; offZ[i] = 0; }

  // army auto-fire
  const W = WEAPONS[weapon];
  fireT -= dt;
  if (fireT <= 0 && count > 0) {
    fireT = W.rate;
    const shots = Math.min(Math.ceil(count / 2), 26);
    for (let s = 0; s < shots && pBul.length < 790; s++) {
      const i = randi(0, drawN - 1);
      const bx = sx[i] + 0.17, bz = sz[i] - 0.5;
      if (phase === 'boss') {
        // aim at the boss
        const tx = bossX + rand(-0.9, 0.9), dx = tx - bx, dz = bossZ - bz, len = Math.hypot(dx, dz) || 1;
        pBul.push({ x: bx, y: 0.62, z: bz, vx: dx / len * W.speed, vz: dz / len * W.speed, life: 80 / W.speed, dmg: W.dmg });
      } else {
        pBul.push({ x: bx, y: 0.62, z: bz, vx: rand(-1.2, 1.2), vz: -W.speed, life: 52 / W.speed, dmg: W.dmg });
      }
    }
  }

  // player bullets
  for (let b = pBul.length - 1; b >= 0; b--) {
    const u = pBul[b];
    u.x += u.vx * dt; u.z += u.vz * dt; u.life -= dt;
    let dead = u.life <= 0 || Math.abs(u.x) > ROAD_HALF + 1;
    if (!dead) {
      for (let s = 0; s < squads.length; s++) {
        const q = squads[s]; const r = radiusFor(q.n);
        const dx = u.x - q.x, dz = u.z - q.z;
        if (dx * dx + dz * dz < r * r) {
          const k = Math.min(u.dmg, q.n);
          q.n -= k; kills += k; dead = true;
          burst(u.x, 0.7, u.z, u.dmg >= 3 ? cOrange : cRed, 4 + u.dmg, 3);
          if (q.n <= 0) { burst(q.x, 0.8, q.z, cYellow, 20, 6); removeSquad(s); }
          break;
        }
      }
    }
    if (!dead) {
      for (let hI = 0; hI < heavies.length; hI++) {
        const h = heavies[hI];
        if (Math.abs(u.x - h.x) < h.hw && Math.abs(u.z - h.z) < h.hd) {
          dead = true; h.hp -= u.dmg; h.flash = 0.06;
          if (Math.random() < 0.3) burst(u.x, rand(0.4, 1.4), h.z + h.hd, h.type === 'tank' ? cOrange : cSand, 2 + u.dmg, 3);
          if (h.hp <= 0) { kills += h.type === 'tank' ? 10 : 5; destroyHeavy(hI); }
          break;
        }
      }
    }
    if (!dead && phase === 'boss' && u.z <= bossZ + 1.2 && u.z > bossZ - 2 && Math.abs(u.x - bossX) < BOSS_HALF_W) {
      dead = true; bossHp -= u.dmg; bossFlash = 0.08;
      if (Math.random() < 0.25) burst(u.x, rand(1, 4), bossZ + 1, cRed, 2, 3);
      if (bossHp <= 0) bossDefeated();
    }
    if (dead) { pBul[b] = pBul[pBul.length - 1]; pBul.pop(); }
  }

  // enemy squads
  for (let s = squads.length - 1; s >= 0; s--) {
    const q = squads[s];
    const ahead = pz - q.z;
    if (ahead > 0 && ahead < 70) q.z += 1.3 * dt;
    if (ahead > 0 && ahead < 52) {
      q.fireT -= dt;
      if (q.fireT <= 0) {
        q.fireT = rand(0.85, 1.35);
        const shots = Math.min(Math.ceil(q.n / (eL < 3 ? 5 : 3.5)), 9);
        const qn = Math.min(q.n, MAX_DRAW);
        for (let j = 0; j < shots && eBul.length < 590; j++) {
          const f = FORM[randi(0, qn - 1)];
          const ox = q.x + f[0], oz = q.z - f[1];
          const tx = px + rand(-armyR, armyR) * 0.8, tz = pz + rand(-armyR, armyR) * 0.5;
          const dx = tx - ox, dz = tz - oz, len = Math.hypot(dx, dz) || 1;
          eBul.push({ x: ox, y: 0.62, z: oz + 0.5, vx: (dx / len) * 17, vz: (dz / len) * 17, life: 4 });
        }
      }
    }
    // lateral movement: squads steer to intercept the army
    const qr = radiusFor(q.n);
    const maxX = Math.max(0, ROAD_HALF - qr * 0.7);
    if (ahead > -2 && ahead < 60) {
      const latSpd = 3.2 + Math.min(eL, 8) * 0.4;
      const target = px + Math.sin(time * 1.7 + q.phase) * 0.6;
      q.x += clamp(target - q.x, -latSpd * dt, latSpd * dt);
    } else {
      q.x += Math.sin(time * 0.9 + q.phase) * 1.5 * dt;
    }
    q.x = clamp(q.x, -maxX, maxX);

    // melee: soldiers trade 1-for-1 while the squads are touching
    const dx = q.x - px, dz = q.z - pz;
    if (count > 0 && Math.abs(dz) < (armyR + qr) * 0.7 && Math.abs(dx) < (armyR + qr) * 0.8) {
      if (!q.engaged) { q.engaged = true; q.traded = 0; }
      q.z = Math.min(q.z, pz - (armyR + qr) * 0.5);
      q.x += (px - q.x) * Math.min(1, dt * 4);
      q.trade += dt * (18 + Math.min(count, q.n) * 1.5);
      while (q.trade >= 1 && count > 0 && q.n > 0) {
        q.trade -= 1; q.n--; changeArmy(-1); kills++; q.traded++;
        const mx2 = (px + q.x) / 2 + rand(-1, 1), mz2 = (pz + q.z) / 2;
        burst(mx2, 0.7, mz2, cRed, 3, 3); burst(mx2, 0.7, mz2, cBlue, 3, 3);
      }
      hurtFlash();
    } else if (q.engaged) {
      q.engaged = false; q.trade = 0;
      if (q.traded) floatText(`-${q.traded}`, '#ff5a4f', px, 2.5, pz);
    }
    if (q.n <= 0) {
      if (q.traded) floatText(`-${q.traded}`, '#ff5a4f', px, 2.5, pz);
      burst(q.x, 0.8, q.z, cYellow, 20, 6);
      removeSquad(s); continue;
    }
    if (q.z > pz + 14) removeSquad(s);
  }

  // heavy enemies
  for (let i = heavies.length - 1; i >= 0; i--) {
    const h = heavies[i];
    const ahead = pz - h.z;
    if (h.type === 'tank' && ahead > 0 && ahead < 75) {
      h.z += 2 * dt;
      const lat = 1.3 + L * 0.12;
      h.x += clamp(px - h.x, -lat * dt, lat * dt);
      h.x = clamp(h.x, -ROAD_HALF + h.hw + 0.3, ROAD_HALF - h.hw - 0.3);
    }
    h.group.position.set(h.x, h.type === 'tank' ? Math.abs(Math.sin(time * 14 + h.phase)) * 0.03 : 0, h.z);
    const aimA = Math.atan2(px - h.x, pz - h.z);
    h.aim.rotation.y = aimA;
    if (h.flash > 0) h.flash -= dt;
    h.flashMat.emissive.setHex(h.flash > 0 ? 0x664422 : 0x000000);
    // badly damaged heavies trail black smoke
    if (h.hp < h.max * 0.5 && Math.random() < dt * 7) puff(h.x + rand(-0.5, 0.5), h.type === 'tank' ? 1.6 : 1.0, h.z, 1, 0.7, 0.2);

    if (count > 0 && ahead > 3 && ahead < 55) {
      if (h.type === 'bunker') {
        // machine gun: long rapid bursts with short pauses
        h.burstT += dt;
        if (h.burstT % 2.2 < 1.5) {
          h.fireT -= dt;
          if (h.fireT <= 0 && eBul.length < 590) {
            h.fireT = Math.max(0.06, 0.14 - 0.01 * L);
            const ox = h.x + Math.sin(aimA) * 1.1, oz = h.z + Math.cos(aimA) * 1.1;
            const tx = px + rand(-1, 1) * armyR * 0.6, tz = pz + rand(-1, 1) * armyR * 0.4;
            const dx = tx - ox, dz = tz - oz, len = Math.hypot(dx, dz) || 1;
            eBul.push({ x: ox, y: 1.12, z: oz, vx: dx / len * 24, vz: dz / len * 24, life: 4, dmg: 1, s: 0.75 });
          }
        }
      } else {
        // tank cannon: heavy shells, plus a coaxial machine gun between shots
        h.fireT -= dt;
        if (h.fireT <= 0 && eBul.length < 590) {
          h.fireT = Math.max(0.9, 1.8 - 0.1 * L);
          const ox = h.x + Math.sin(aimA) * 4, oz = h.z + Math.cos(aimA) * 4;
          const tx = px + rand(-1, 1) * armyR * 0.3, tz = pz;
          const dx = tx - ox, dz = tz - oz, len = Math.hypot(dx, dz) || 1;
          eBul.push({ x: ox, y: 1.42, z: oz, vx: dx / len * 16, vz: dz / len * 16, life: 5, dmg: 4 + Math.floor(L / 2), s: 2.4 });
          burst(ox, 1.42, oz, cOrange, 8, 3);
          puff(ox, 1.4, oz, 4, 0.8, 0.8);
        }
        h.burstT -= dt;
        if (h.burstT <= 0 && eBul.length < 590) {
          h.burstT = 0.22;
          const ox = h.x + Math.sin(aimA) * 1.6, oz = h.z + Math.cos(aimA) * 1.6;
          const tx = px + rand(-1, 1) * armyR * 0.6, tz = pz + rand(-1, 1) * armyR * 0.4;
          const dx = tx - ox, dz = tz - oz, len = Math.hypot(dx, dz) || 1;
          eBul.push({ x: ox, y: 1.8, z: oz, vx: dx / len * 24, vz: dz / len * 24, life: 4, dmg: 1, s: 0.7 });
        }
      }
    }

    // touching a bunker or tank: the army loses soldiers fast while hacking at it
    if (count > 0 && Math.abs(px - h.x) < armyR * 0.8 + h.hw && Math.abs(pz - h.z) < armyR * 0.6 + h.hd) {
      h.trade += dt * (h.type === 'tank' ? 22 : 16);
      while (h.trade >= 1 && count > 0 && h.hp > 0) {
        h.trade -= 1; changeArmy(-1); h.hp -= W.dmg * 2; h.traded++;
        burst(lerp(px, h.x, 0.5) + rand(-1, 1), 0.7, lerp(pz, h.z, 0.5), cBlue, 3, 3);
      }
      hurtFlash();
    } else if (h.traded) { floatText(`-${h.traded}`, '#ff5a4f', px, 2.5, pz); h.traded = 0; }
    if (h.hp <= 0) { if (h.traded) floatText(`-${h.traded}`, '#ff5a4f', px, 2.5, pz); kills += h.type === 'tank' ? 10 : 5; destroyHeavy(i); continue; }
    if (h.z > pz + 14) removeHeavy(i);
  }

  // weapon crates dropped by destroyed heavies
  for (let i = crates.length - 1; i >= 0; i--) {
    const c = crates[i];
    c.t += dt;
    c.group.rotation.y += dt * 1.6;
    c.group.position.y = 0.6 + Math.abs(Math.sin(c.t * 3)) * 0.25;
    if (count > 0 && Math.abs(c.x - px) < armyR * 0.7 + 0.7 && Math.abs(c.z - pz) < armyR * 0.5 + 0.8) {
      burst(c.x, 1, c.z, cGreen, 30, 6);
      if (weapon < WEAPONS.length - 1) {
        setWeapon(weapon + 1);
        const w = WEAPONS[weapon];
        changeArmy(5);
        toast(`${w.icon} ${w.name}!  ${w.dmg} dmg${w.rate < 0.2 ? ' • rapid fire' : ''}`, '#7dffb0');
        floatText(`${w.icon} +5`, '#7dffb0', px, 2.5, pz);
      } else {
        changeArmy(10);
        toast('➕ 10 soldiers!', '#7dffb0');
        floatText('+10', '#5dff8a', px, 2.5, pz);
      }
      removeCrate(i); continue;
    }
    if (c.z > pz + 10) removeCrate(i);
  }

  // boss behaviour
  if (phase === 'boss') {
    bossT += dt;
    bossX = Math.sin(bossT * (0.45 + 0.05 * L)) * 5;
    boss.position.x = bossX;
    bossFireT -= dt;
    if (bossFireT <= 0) {
      bossVolley++;
      bossFireT = Math.max(0.6, 1.0 - 0.05 * L);
      const sp = 10 + L * 0.7;
      const oz = bossZ + 1.5;
      if (bossVolley % 4 === 0) {
        // fan blast sweeping the whole arena
        const n = 9 + L;
        for (let j = 0; j < n; j++) {
          const a = (j / (n - 1) - 0.5) * 0.2 + Math.atan2(px - bossX, pz - bossZ);
          eBul.push({ x: bossX, y: 1.6, z: oz, vx: Math.sin(a) * sp, vz: Math.cos(a) * sp, life: 6 });
        }
      } else {
        const shots = 4 + L;
        for (let j = 0; j < shots; j++) {
          const ox = bossX + rand(-0.8, 0.8);
          const tx = px + rand(-1, 1) * armyR * 0.45, tz = pz + rand(-1, 1) * armyR * 0.35;
          const dx = tx - ox, dz = tz - oz, len = Math.hypot(dx, dz) || 1;
          eBul.push({ x: ox, y: 1.1, z: oz, vx: (dx / len) * sp, vz: (dz / len) * sp, life: 6 });
        }
      }
    }
    if (!wave) { waveDelay -= dt; if (waveDelay <= 0) startWave(); }
    else {
      wave.t -= dt;
      if (wave.t <= 0) { clearBalls(true); wave = null; waveDelay = 0.8; }
    }
  } else if (phase === 'victory') {
    winT -= dt;
    if (winT <= 0) { state = 'win'; showWin(); }
  }

  // enemy bullets
  for (let b = eBul.length - 1; b >= 0; b--) {
    const u = eBul[b];
    u.x += u.vx * dt; u.z += u.vz * dt; u.life -= dt;
    let dead = u.life <= 0 || u.z > pz + 12;
    if (!dead && count > 0) {
      const dx = u.x - px, dz = u.z - pz;
      if (dx * dx + dz * dz < armyR * armyR) {
        dead = true; changeArmy(-(u.dmg || 1));
        burst(u.x, 0.7, u.z, u.dmg > 1 ? cOrange : cBlue, u.dmg > 1 ? 16 : 6, u.dmg > 1 ? 5 : 3);
        if (u.dmg > 1) floatText(`-${u.dmg}`, '#ff5a4f', u.x, 1.8, u.z);
        hurtFlash();
      }
    }
    if (dead) { eBul[b] = eBul[eBul.length - 1]; eBul.pop(); }
  }

  // health balls: lobbed by the boss, then picked up by walking the army's centre over them
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    b.t += dt;
    if (b.t < 0) continue;
    b.mesh.visible = true;
    const f = Math.min(1, b.t / b.dur);
    b.x = lerp(b.sx, b.tx, f); b.z = lerp(b.sz, b.tz, f);
    b.y = lerp(5, 0.6, f) + 7 * f * (1 - f);
    if (f >= 1) {
      if (!b.landed) { b.landed = true; burst(b.x, 0.3, b.z, cGreen, 8, 2); }
      b.y = 0.6 + Math.abs(Math.sin(time * 4 + i)) * 0.25;
      b.mesh.rotation.y += dt * 2;
    }
    b.mesh.position.set(b.x, b.y, b.z);
    if (b.landed && count > 0 && phase === 'boss' && Math.hypot(b.x - px, b.z - pz) < pickR + 0.45) {
      if (b.correct) {
        window.portalSound?.play('good');
        streak++; correctN++;
        const gain = Math.max(5 + Math.round(eL * 2), Math.round(count * 0.2)) + Math.min(streak - 1, 5);
        changeArmy(gain);
        toast(`✔ ${wave.p.text} = ${b.val}  +${gain}`, '#5dff8a');
        floatText(`+${gain}`, '#5dff8a', px, 2.5, pz);
        burst(b.x, 1, b.z, cGreen, 30, 6);
        clearBalls(true); wave = null; waveDelay = 1.2;
        break;
      } else {
        window.portalSound?.play('bad');
        streak = 0; wrongN++;
        const loss = Math.max(3 + Math.round(eL * 1.5), Math.round(count * 0.15));
        changeArmy(-loss);
        toast(`✘ ${b.val} is wrong  −${loss}`, '#ff6a5f');
        floatText(`-${loss}`, '#ff5a4f', px, 2.5, pz);
        burst(b.x, 1, b.z, cRed, 25, 6);
        hurtFlash();
        removeBall(i);
      }
    }
  }

  // gates
  for (let g = gates.length - 1; g >= 0; g--) {
    const G = gates[g];
    if (!G.resolved && pz <= G.z) {
      G.resolved = true;
      const idx = clamp(Math.floor((px + ROAD_HALF) / G.w), 0, G.options.length - 1);
      const chosen = G.options[idx];
      const ok = chosen.val === G.p.ans;
      for (const o of G.options) {
        drawPanel(o.canvas, String(o.val), o.val === G.p.ans ? 'good' : (o === chosen ? 'bad' : 'idle'));
        o.tex.needsUpdate = true;
      }
      drawSign(G.signCanvas, `${G.p.text} = ${G.p.ans}`); G.signTex.needsUpdate = true;
      if (ok) {
        window.portalSound?.play('good');
        streak++; correctN++;
        const gain = Math.min(Math.max(4 + Math.round(eL * 3), Math.round(count * 0.15)), 40 + L * 10) + Math.min(streak - 1, 5) * 2;
        changeArmy(gain);
        toast(`✔ Correct! +${gain}`, '#5dff8a');
        floatText(`+${gain}`, '#5dff8a', px, 2.5, pz);
        burst(px, 1, pz, cGreen, 30, 6);
      } else {
        window.portalSound?.play('bad');
        streak = 0; wrongN++;
        const loss = Math.max(3 + Math.round(eL * 2), Math.round(count * 0.3));
        changeArmy(-loss);
        toast(`✘ ${G.p.text} = ${G.p.ans}  −${loss}`, '#ff6a5f');
        floatText(`-${loss}`, '#ff5a4f', px, 2.5, pz);
        burst(px, 1, pz, cRed, 30, 6);
        hurtFlash();
      }
    }
    if (G.z > pz + 25) { disposeGroup(G.group); gates.splice(g, 1); }
  }

  for (const d of decor) if (d.position.z > pz + 25) placeDecor(d, pz - rand(120, 160));
  recycleTufts(false);

  if (count <= 0 && phase !== 'victory') {
    state = 'over';
    burst(px, 1, pz, cBlue, 40, 7);
    setTimeout(showGameOver, 900);
  }
}

// ---------- render sync ----------
const tmpV = new THREE.Vector3();
function sync(dt) {
  for (let p = parts.length - 1; p >= 0; p--) {
    const q = parts[p];
    q.vy -= 18 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt; q.life -= dt;
    if (q.y < 0.05) { q.y = 0.05; q.vy *= -0.3; q.vx *= 0.7; q.vz *= 0.7; }
    if (q.life <= 0) { parts[p] = parts[parts.length - 1]; parts.pop(); }
  }
  dummy.rotation.set(0, 0, 0);
  parts.forEach((q, i) => { dummy.position.set(q.x, q.y, q.z); dummy.scale.setScalar(Math.max(0.2, q.life * 1.5)); dummy.updateMatrix(); partMesh.setMatrixAt(i, dummy.matrix); partMesh.setColorAt(i, q.c); });
  partMesh.count = parts.length; partMesh.instanceMatrix.needsUpdate = true; if (partMesh.instanceColor) partMesh.instanceColor.needsUpdate = true;
  dummy.scale.setScalar(1);

  const W = WEAPONS[weapon];
  pBul.forEach((u, i) => { dummy.position.set(u.x, u.y, u.z); dummy.rotation.set(0, Math.atan2(u.vx, u.vz), 0); dummy.scale.set(W.sw, W.sw, W.len * W.sw); dummy.updateMatrix(); pBulletMesh.setMatrixAt(i, dummy.matrix); });
  pBulletMesh.count = pBul.length; pBulletMesh.instanceMatrix.needsUpdate = true;
  dummy.rotation.set(0, 0, 0);
  eBul.forEach((u, i) => { dummy.position.set(u.x, u.y, u.z); dummy.scale.setScalar(u.s || 1); dummy.updateMatrix(); eBulletMesh.setMatrixAt(i, dummy.matrix); });
  eBulletMesh.count = eBul.length; eBulletMesh.instanceMatrix.needsUpdate = true;
  dummy.scale.setScalar(1);

  const playing = state === 'play';
  const marching = playing && phase === 'run';
  const drawN = Math.min(count, MAX_DRAW);
  armyTroops.begin();
  for (let i = 0; i < drawN; i++) {
    if (!playing) { offX[i] += (FORM[i][0] - offX[i]) * 0.1; offZ[i] += (FORM[i][1] - offZ[i]) * 0.1; sx[i] = px + offX[i]; sz[i] = pz + offZ[i]; }
    const ph = time * (marching ? 11 * boost : 8) + i * 1.7;
    const bob = playing ? Math.abs(Math.cos(ph)) * 0.07 : 0;
    armyTroops.add(sx[i], bob, sz[i], Math.sin(time * 11 + i) * 0.06, playing ? Math.sin(ph) * 0.6 : 0);
  }
  armyTroops.end();

  enemyTroops.begin();
  for (const q of squads) {
    const qn = Math.min(q.n, MAX_DRAW);
    for (let i = 0; i < qn; i++) {
      const f = FORM[i];
      const x = clamp(q.x + f[0], -ROAD_HALF + 0.3, ROAD_HALF - 0.3);
      const ph = time * 8 + i * 1.3;
      enemyTroops.add(x, Math.abs(Math.cos(ph)) * 0.05, q.z - f[1], Math.PI, Math.sin(ph) * 0.45);
    }
  }
  enemyTroops.end();

  // smoke drifts up, swells and fades out by shrinking
  for (let p = smoke.length - 1; p >= 0; p--) {
    const q = smoke[p];
    q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt; q.vy *= 1 - dt * 0.6; q.life -= dt;
    if (q.life <= 0) { smoke[p] = smoke[smoke.length - 1]; smoke.pop(); }
  }
  smoke.forEach((q, i) => {
    const t = 1 - q.life / q.max;
    dummy.position.set(q.x, q.y, q.z); dummy.scale.setScalar(q.s * (0.6 + t * 1.6) * Math.min(1, q.life * 1.5)); dummy.updateMatrix();
    smokeMesh.setMatrixAt(i, dummy.matrix); smokeMesh.setColorAt(i, q.c);
  });
  smokeMesh.count = smoke.length; smokeMesh.instanceMatrix.needsUpdate = true; if (smokeMesh.instanceColor) smokeMesh.instanceColor.needsUpdate = true;
  dummy.scale.setScalar(1);

  // boss visuals
  if (bossFlash > 0) bossFlash -= dt;
  bossMat.emissive.setHex(bossFlash > 0 ? 0x662222 : 0x000000);
  boss.position.y = phase === 'boss' ? Math.abs(Math.sin(time * 3)) * 0.25 : 0;
  pickRing.visible = phase === 'boss' && count > 0;
  if (pickRing.visible) {
    pickRing.position.set(px, 0.05, pz);
    pickRing.scale.setScalar(clamp(radiusFor(count) * 0.45, 0.9, 1.8) + 0.45);
  }

  // camera: chase cam while marching, wide fixed view of the arena during the boss fight
  camX += (px * 0.55 - camX) * Math.min(1, dt * 5);
  if (phase === 'run') {
    camPos.set(camX, 15, pz + 17); camLook.set(camX * 0.6, 0, pz - 13);
  } else {
    const t = Math.min(1, dt * 2.5);
    camPos.lerp(tmpV.set(px * 0.3, 22, runEnd + 20), t);
    camLook.lerp(tmpV.set(px * 0.2, 0, runEnd - 15), t);
  }
  camera.position.copy(camPos); camera.lookAt(camLook);
  sun.target.position.set(px, 0, pz - 15);
  sun.position.copy(sun.target.position).add(SUN_OFF);
  sky.position.copy(camera.position);
  treadTex.offset.x = -time * 0.9;
  roadGroup.position.z = Math.round((pz - 110) / 12) * 12;

  // labels
  const ap = project(px, 1.6, pz - radiusFor(count) * 0.3);
  armyLabel.style.display = count > 0 && ap.vis ? 'block' : 'none';
  armyLabel.textContent = count;
  armyLabel.style.left = ap.x + 'px'; armyLabel.style.top = ap.y + 'px';
  for (const q of squads) {
    const p = project(q.x, 1.6, q.z);
    const show = p.vis && pz - q.z < 75;
    q.el.style.display = show ? 'block' : 'none';
    if (show) { q.el.textContent = q.n; q.el.style.left = p.x + 'px'; q.el.style.top = p.y + 'px'; }
  }
  for (const h of heavies) {
    const p = project(h.x, h.type === 'tank' ? 3.2 : 2.6, h.z);
    const show = p.vis && pz - h.z < 80 && pz - h.z > -6;
    h.el.style.display = show ? 'block' : 'none';
    if (show) { h.el.style.left = p.x + 'px'; h.el.style.top = p.y + 'px'; h.fill.style.width = Math.max(0, h.hp / h.max) * 100 + '%'; }
  }
  for (const c of crates) {
    const p = project(c.x, 2, c.z);
    c.el.style.display = p.vis ? 'block' : 'none';
    if (p.vis) { c.el.textContent = crateText(); c.el.style.left = p.x + 'px'; c.el.style.top = p.y + 'px'; }
  }
  for (const b of balls) {
    const p = project(b.x, b.y + 0.7, b.z);
    const show = b.t >= 0 && p.vis;
    b.el.style.display = show ? 'block' : 'none';
    if (show) { b.el.style.left = p.x + 'px'; b.el.style.top = p.y + 'px'; }
  }
  const showBar = phase === 'boss' || (phase === 'run' && pz - bossZ < 70);
  bossBar.style.display = showBar && boss.visible ? 'block' : 'none';
  if (showBar) {
    const p = project(bossX, 7.2, bossZ);
    bossBar.style.left = p.x + 'px'; bossBar.style.top = p.y + 'px';
    bossBar.querySelector('.fill').style.width = (phase === 'boss' ? Math.max(0, bossHp / bossMax) * 100 : 100) + '%';
  }

  // HUD
  $('lvlName').textContent = `Level ${L + 1}: ${cfg.name}`;
  $('cnt').textContent = count;
  $('weapon').textContent = `${WEAPONS[weapon].icon} ${WEAPONS[weapon].name} (${WEAPONS[weapon].dmg} dmg)`;
  $('dist').textContent = phase === 'run' ? `🏁 Boss in ${Math.max(0, Math.ceil(pz - runEnd))} m` : (phase === 'boss' ? '⚔ BOSS FIGHT' : '🏆 Victory!');
  $('pace').textContent = (speed / BASE_SPEED).toFixed(1);
  $('streak').textContent = streak;
  $('progFill').style.width = (phase === 'run' ? progress * 100 : 100) + '%';
  const eqBox = $('eqBox');
  const next = gates.find((g) => !g.resolved);
  if (playing && phase === 'run' && next && next.z > pz - 120) {
    eqBox.style.display = 'block'; eqBox.className = '';
    $('eqLabel').textContent = `Next gate in ${Math.max(0, Math.floor(pz - next.z))} m — pick the answer!`;
    $('eqText').textContent = `${next.p.text} = ?`;
  } else if (playing && phase === 'boss' && wave) {
    eqBox.style.display = 'block'; eqBox.className = 'boss';
    $('eqLabel').textContent = `Grab the health ball with the answer! (${Math.ceil(wave.t)}s)`;
    $('eqText').textContent = `${wave.p.text} = ?`;
  } else eqBox.style.display = 'none';

  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) $('toast').style.opacity = 0; }
  if (flashTimer > 0) { flashTimer -= dt; if (flashTimer <= 0) $('flash').style.opacity = 0; }
}

// ---------- loop ----------
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (state === 'play') update(dt);
  else if (state !== 'paused') time += dt;
  if (state !== 'paused') sync(dt);
  renderer.render(scene, camera);
  watchFps(state === 'play');
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

setGfxMode(gfxMode);
resetLevel(lastLevel);
showMenu();
frame();

// test hook
window.__game = {
  get state() { return state; }, get phase() { return phase; },
  get count() { return count; }, set count(v) { count = v; },
  get px() { return px; }, set px(v) { px = v; },
  get pz() { return pz; }, set pz(v) { pz = v; },
  get runEnd() { return runEnd; }, get bossZ() { return bossZ; },
  get bossHp() { return bossHp; }, set bossHp(v) { bossHp = v; }, get bossMax() { return bossMax; },
  get gates() { return gates; }, get squads() { return squads; }, get balls() { return balls; }, get wave() { return wave; },
  get levelTime() { return levelTime; },
  get heavies() { return heavies; }, get crates() { return crates; },
  get weapon() { return weapon; }, set weapon(v) { setWeapon(v); },
  dropCrate: (x, z) => dropCrate(x, z),
  get gfx() { return { mode: gfxMode, low: gfxLow, weakHw }; }, setGfx: (m) => setGfxMode(m),
};
</script>
</body>
