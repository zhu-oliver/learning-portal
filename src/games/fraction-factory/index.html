const $=id=>document.getElementById(id);
// ================= exact fractions =================
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1};

function tone(f,dur,type='sine',vol=.2,when=0,slide=0){const a=ac();if(!a||muted)return;const t=a.currentTime+when;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05)}

 else{const big=fcmp(o.A.f,o.B.f)>0?o.A:o.B,sm=big===o.A?o.B:o.A;title=isTimeout?'⏰ Too slow!':'Oops! Wrong box 🤖';text=`Box ${big.tag} (${big.html}) is bigger than box ${sm.tag} (${sm.html}). ${nm} wanted the <b>${o.want}</b> one: box <b>${(o.want==='bigger'?big:sm).tag}</b>.`}

 const last=G.rush?G.lives<=0:G.orderIdx>=G.total;
 showCard(`<h2>${title}</h2><canvas class="teach" id="teachCv" width="560" height="${o.type==='set'?250:300}"></canvas><div class="lesson">${text}</div>${G.rush?`<div class="stats"><div>${'❤️'.repeat(Math.max(0,G.lives))||'💔'} lives left</div></div>`:''}<button class="grn" id="nextBtn">${last?'Finish 🏁':'Next order ▶'}</button>`);
 drawTeach($('teachCv'),o,isTimeout?null:gave);$('nextBtn').onclick=()=>{SFX.click();nextOrder()}}
// ================= end cards =================
function starsFor(c,t){const pass=Math.ceil(t*.6);return c===t?3:(c>=t-2&&c>=pass)?2:c>=pass?1:0}
function finishLevel(){G.state='done';setGameUI(false);const L=LEVELS[G.li];const st=starsFor(G.correct,G.total);
 if(st>0){save.stars[G.li]=Math.max(save.stars[G.li],st);persist();SFX.win();confetti(0,4,0,gfxLow?60:180);if(robot){drawFace(robot,'happy');robot.jump=2}
  const nxt=G.li+1<LEVELS.length;
  showCard(`<h2>🎉 Level ${G.li+1} complete!</h2><div class="big">${'★'.repeat(st)}<span style="color:#e2d6ee">${'★'.repeat(3-st)}</span></div><div class="stats"><div>✅ ${G.correct}/${G.total} orders</div><div>🪙 +${G.earned} coins</div></div><div class="lesson">📘 ${L.lesson}</div>${nxt?'<button class="grn" id="nextLv">Next level ▶</button>':'<button class="grn" id="rushBtn">⚡ Try Rush Mode</button>'}<button class="sec" id="replay">↻ Replay</button><button class="sec" id="lvls">🗺️ Levels</button>`);
  if(nxt)$('nextLv').onclick=()=>startLevel(G.li+1);else $('rushBtn').onclick=startRush}
 else{SFX.fail();showCard(`<h2>🔧 Keep practising!</h2><div class="sub">You served ${G.correct} of ${G.total} orders right. You need ${Math.ceil(G.total*.6)} to pass.</div><div class="lesson">📘 ${L.lesson}</div><button class="grn" id="replay">↻ Try again</button><button class="sec" id="lvls">🗺️ Levels</button>`)}
 $('replay').onclick=()=>startLevel(G.li,true);$('lvls').onclick=showLevels}
function rushOver(){G.state='done';setGameUI(false);const best=G.served>(save.rushBest||0);if(G.correct>(save.rushBest||0)){save.rushBest=G.correct;persist()}SFX.win();
 showCard(`<h2>⚡ Rush over!</h2><div class="logo">🏭</div><div class="stats"><div>✅ ${G.correct} correct</div><div>📦 ${G.served} orders</div><div>🪙 +${G.earned}</div><div>🏆 Best: ${save.rushBest}</div></div><div class="lesson">The belt got faster and faster! Practise the levels to grow your fraction super-powers. 💪</div><button class="grn" id="again">↻ Play again</button><button class="sec" id="lvls">🗺️ Levels</button>`);
 $('again').onclick=startRush;$('lvls').onclick=showLevels}
function showLevels(){if(G.state==='playing'){G.paused='playing';G.state='paused'}else if(G.state!=='paused')G.paused=null;setGameUI(G.state==='paused');
 let h=`<h2>🗺️ Choose a level</h2><div class="levels">`;LEVELS.forEach((L,i)=>{const s=save.stars[i];h+=`<button class="lv" data-i="${i}" ${unlocked(i)?'':'disabled'}><div class="e">${unlocked(i)?L.icon:'🔒'}</div><div class="n">${i+1}. ${L.name}</div><div class="s">${'★'.repeat(s)}<span style="color:#cbb9dc">${'★'.repeat(3-s)}</span></div></button>`});
 h+=`</div><button id="rushBtn">⚡ Rush Mode <small>(best ${save.rushBest||0})</small></button>${G.paused?'<button class="grn" id="resume">▶ Resume</button>':'<button class="sec" id="home">🏠 Title</button>'}`;showCard(h,true);
 document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{ac();SFX.click();G.paused=null;startLevel(+b.dataset.i)});
 $('rushBtn').onclick=()=>{ac();G.paused=null;startRush()};if($('resume'))$('resume').onclick=resume;if($('home'))$('home').onclick=showTitle}
function resume(){if(G.paused){G.state=G.paused;G.paused=null}hideCard();setGameUI(true)}
function showTitle(){G.state='title';G.paused=null;setGameUI(false);const cont=Math.max(0,LEVELS.findIndex((L,i)=>unlocked(i)&&save.stars[i]===0));const nextLv=cont<0?0:cont;const total=save.stars.reduce((a,b)=>a+b,0);
 showCard(`<div class="logo">🍕🏭🍫</div><h1>Fraction Factory</h1><div class="sub">Slice, scoop and pack fractions for hungry robots! 🤖</div><div class="stats"><div>⭐ ${total}/${LEVELS.length*3}</div><div>🪙 ${save.coins}</div><div>⚡ Rush best ${save.rushBest||0}</div></div><div class="lesson">1️⃣ Read the robot's order.<br>2️⃣ Pick a slicer size to cut the food into equal pieces.<br>3️⃣ Tap pieces to put them in the box, then press <b>📦 Deliver!</b></div><button class="grn" id="playBtn">▶ Play</button><button id="lvBtn2">🗺️ Levels</button><button class="sec" id="rushBtn">⚡ Rush</button>`);
 $('playBtn').onclick=()=>{ac();SFX.click();startLevel(nextLv)};$('lvBtn2').onclick=()=>{ac();showLevels()};$('rushBtn').onclick=()=>{ac();startRush()}}
// ================= buttons & input =================
$('wholeBtn').onclick=selectWhole;$('clearSel').onclick=clearSel;$('deliverBtn').onclick=()=>{ac();deliver()};
$('pickA').onclick=()=>{ac();chooseCrate(0)};$('pickB').onclick=()=>{ac();chooseCrate(1)};
$('hintBtn').onclick=()=>{if(G.state!=='playing'||!G.order)return;const hb=$('hintBox');const show=hb.style.display!=='block';hb.style.display=show?'block':'none';if(show&&!G.hintUsed){G.hintUsed=true;toast('💡 Hint on — coins for this order are halved',1300)}SFX.click()};
$('lvlBtn').onclick=()=>{ac();if(G.state==='delivering'||G.state==='timeout')return;showLevels()};
const gfxLabel=()=>'⚙️ '+gfxMode[0].toUpperCase()+gfxMode.slice(1);$('gfxBtn').textContent=gfxLabel();
$('gfxBtn').onclick=()=>{gfxMode=gfxMode==='auto'?'high':gfxMode==='high'?'low':'auto';localStorage.setItem(GKEY,gfxMode);$('gfxBtn').textContent=gfxLabel();toast('Graphics: '+gfxMode+' — reloading…');setTimeout(()=>location.reload(),600)};
$('sndBtn').textContent=muted?'🔇':'🔊';$('sndBtn').onclick=()=>{muted=!muted;localStorage.setItem('fractionFactoryMute',muted?'1':'0');$('sndBtn').textContent=muted?'🔇':'🔊';if(!muted)SFX.click()};
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pickAt(cx,cy){ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const hits=ray.intersectObjects(bench.mode==='cmp'?crates:itemRoot.children,true);
 for(const h of hits){let o=h.object;while(o&&!(o.userData.piece||o.userData.ball||o.userData.crate||o.userData.plate))o=o.parent;if(o)return o}return null}
renderer.domElement.addEventListener('pointerdown',e=>{ac();if(G.state!=='playing')return;const o=pickAt(e.clientX,e.clientY);if(o)handleTap(o)});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;renderer.domElement.style.cursor=G.state==='playing'&&pickAt(e.clientX,e.clientY)?'pointer':'default'});
addEventListener('keydown',e=>{if(G.state!=='playing')return;if(e.key==='Enter')deliver();else if(e.key==='Escape')clearSel();else if(e.key==='w'||e.key==='W')selectWhole()});
// ================= camera / loop =================
const camTarget=new THREE.Vector3();
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;const portrait=w/h<.85;camera.fov=portrait?52:40;
 const t=Math.tan(THREE.MathUtils.degToRad(camera.fov/2)); const halfW=portrait?4.9:6.8,halfH=5.1;const D=Math.max(halfH/t,halfW/(t*camera.aspect));
  camTarget.set(portrait?.4:.6,portrait?1.1:1.7,portrait?-1.9:-1.7);const dir=new THREE.Vector3(0,portrait?2.1:.85,1).normalize();camera.position.copy(camTarget).addScaledVector(dir,D);camera.lookAt(camTarget);
 camera.updateProjectionMatrix()}
addEventListener('resize',resize);
let time=0,lastSec=-1;
function update(dt){time+=dt;const bs=beltSpeed();
 for(const g of gears)g.g.rotation.z+=g.s*dt*bs;
 for(const m of upper.items){m.position.x+=dt*1.2*bs;if(m.position.x>15)m.position.x-=30;m.rotation.y+=dt}upper.mat.map.offset.x-=dt*.04*bs;M.belt.map.offset.x-=dt*.05*bs;
 if(G.state==='playing'){G.pat-=dt;renderPat();const k=G.pat/G.patMax;if(robot){const want=k<.3?'worried':'neutral';if(robot.emo!==want&&(robot.emo==='neutral'||robot.emo==='worried'))drawFace(robot,want)}
  const sec=Math.ceil(G.pat);if(sec<=5&&sec!==lastSec&&sec>0){lastSec=sec;SFX.tick()}if(G.pat<=0)timeout()}
 updTweens(dt);updPieces(dt);updRobots(dt);updConfetti(dt)}
let last=performance.now();
function frame(){requestAnimationFrame(frame);const now=performance.now();const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);renderer.render(scene,camera)}
// ================= test API =================
function solveNow(wrong){const o=G.order;if(G.state!=='playing'||!o)return false;
 if(o.type==='cmp'){const c=fcmp(o.A.f,o.B.f);let idx=(o.want==='bigger')===(c>0)?0:1;if(wrong)idx=1-idx;chooseCrate(idx);return true}
 if(o.type==='set'){const d=o.frac.d;layoutBalls(d,true);let need=o.count;if(wrong)need=need+1<=o.total?need+1:need-1;bench.balls.forEach((b,j)=>setSel(b,j<need));updPlates();renderTools();return true}
 const t=o.target;let N=t.d===1?1:o.allowed.find(N=>N%t.d===0);if(wrong&&t.d===1){N=o.allowed[0]}
 sliceTo(N,true);let need=t.n*N/t.d;if(wrong){const max=o.items*N;need=need+1<=max?need+1:need-1}
 let c=0;for(const it of bench.items)for(const p of it.pieces)setSel(p,c++<need);renderTools();return true}
window.__game={
 get state(){return G.state},get level(){return G.rush?'rush':G.li+1},get G(){return G},get bench(){return bench},
 get order(){const o=G.order;if(!o)return null;return{type:o.type,kind:o.kind,shape:o.shape,target:o.target?fT(o.target):undefined,count:o.count,total:o.total,frac:o.frac?fT(o.frac):undefined,A:o.A&&fT(o.A.f),B:o.B&&fT(o.B.f),want:o.want,items:o.items,allowed:o.allowed,ask:$('ask').textContent}},
 get camera(){return camera},get stars(){return save.stars.slice()},get coins(){return save.coins},get levels(){return LEVELS.length},
 loadLevel(n){startLevel(n-1,true)},startRush,showTitle,showLevels,
 solve(){return solveNow(false)},solveWrong(){return solveNow(true)},deliver,slice(N){sliceTo(N,true);renderTools()},sort(N){layoutBalls(N,true);renderTools()},
 tapPiece(k,i){const p=bench.items[k]&&bench.items[k].pieces[i];if(p)handleTap(p)},pickBox:chooseCrate,selectWhole,clearSel,
 next(){if(G.state==='teach')nextOrder()},
 fastForward(sec){const n=Math.ceil(sec*30);for(let i=0;i<n;i++)update(1/30);renderer.render(scene,camera)},
 unlockAll(){save.all=true;persist()},resetSave(){save={stars:LEVELS.map(()=>0),coins:0,rushBest:0};persist()},
 F,fadd,fsub,fcmp,gcd,gens:GENS,LEVELS
};
resize();showTitle();frame();
