}
function graph(state){

 const ctx=cv.getContext('2d');ctx.setTransform(px,0,0,px,0,0);ctx.clearRect(0,0,w,h);
 const x0=28,x1=w-6,y0=8,y1=h-20, data=state.history, a=data[0].t, b=Math.max(a+DAY,data.at(-1).t), max=Math.max(10,...data.flatMap(d=>lists.map(([,k])=>d[k]))), top=Math.ceil(max/10)*10;

 for(let i=0;i<=4;i++){const y=y1-(y1-y0)*i/4;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();if(i%2===0)ctx.fillText(Math.round(top*i/4),1,y+3)}

const names=list=>list.map(k=>kinds[k][0]+' '+kinds[k][1]).join(' · ');

function checkStatus(){
 const s=sim.state;
 if(s.drought&&!notices.drought){notices.drought=true;toast('☀️ Drought! Wildlife drinks more often.');ping('warn')}
 if(s.invaded&&!notices.goat){notices.goat=true;toast('🐐 Goats have arrived! Find Relocate under Care.');ping('warn')}
 if(!['won','lost'].includes(s.status)||notices.ended)return;

 if(s.status==='won'){best[s.level]=Math.max(best[s.level]||0,s.stars);store.set('stars',best)}
 update();show(s.status);ping(s.status==='won'?'win':'lose');
}
function attempt(t,x,z,interactive=false){const result=sim.place(t,x,z);if(result.ok&&sim.state.time===0){const c=sim.counts(),h=sim.state.history[0];h.plants=plant.reduce((n,k)=>n+c[k],0);h.grazers=grazers.reduce((n,k)=>n+c[k],0);h.hunters=hunters.reduce((n,k)=>n+c[k],0);h.bees=c.bee;h.recyclers=c.worm+c.mushroom}

const ray=new THREE.Raycaster(), groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0), at=new THREE.Vector3(), pointer=new THREE.Vector2(), projected=new THREE.Vector3();
function tap(px,py){

const fingers=new Map();let dragged=false, dragPan=false;
world.addEventListener('pointerdown',e=>{if(e.button!==0&&e.button!==2&&e.button!==1)return;e.preventDefault();world.setPointerCapture(e.pointerId);if(!fingers.size){dragged=false;dragPan=e.shiftKey||e.button!==0}fingers.set(e.pointerId,{x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY});if(fingers.size>1)dragged=true});
