  if(prev&&prev.classList.contains('tc')){const r=prev.getBoundingClientRect();if(e.clientY<r.top+r.height/2){const o=el.offsetTop;list.insertBefore(el,prev);startY+=el.offsetTop-o;}}
  if(next&&next.classList.contains('tc')){const r=next.getBoundingClientRect();if(e.clientY>r.top+r.height/2){const o=el.offsetTop;list.insertBefore(next,el);startY+=el.offsetTop-o;}}
  el.style.transform=`translateY(${e.clientY-startY}px)`};
 const up=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);el.classList.remove('drag');el.style.transform='';
  tl.order=[...list.querySelectorAll('.tc')].map(x=>+x.dataset.i);sfx.click();document.querySelectorAll('.tc').forEach(x=>x.classList.remove('ok','no'))};
 el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
function peekDate(){const hidden=tl.order.filter(i=>!tl.rev.has(i));if(!hidden.length)return;const i=hidden[Math.floor(Math.random()*hidden.length)];tl.rev.add(i);st.peeks++;sfx.click();renderTimeline()}
function checkTimeline(){const c=correctOrder();const res=tl.order.map((v,p)=>v===c[p]);
 if(res.every(Boolean)){tl.order.forEach(i=>tl.rev.add(i));renderTimeline(res);$('fb').className='fb good';$('fb').textContent='✅ Perfect order! The time machine is powering up…';document.querySelectorAll('#card button').forEach(b=>b.disabled=true);setTimeout(levelWon,1300);return}
 res.forEach((ok,p)=>{if(ok)tl.rev.add(tl.order[p])});wrongFx();renderTimeline(res);sfx.bad()}
function calcStars(){const s=st.mistakes+st.peeks*.5;return s<=1?3:s<=3?2:1}
function levelWon(){hideCard();st.done=true;tl=null;const s=calcStars();const best=Math.max(prog.stars[li],s);prog.stars[li]=best;saveProg();updateHud();
 sfx.power();emit(tm.position.x,1.8,tm.position.z,{n:50,color:0x7ff6ff,speed:7,life:1.2});flash();
 setTimeout(()=>{sfx.win();const last=li===N-1;const sorted=correctOrder().map(i=>E.tl[i]);
  showCard(`<div class="emo">${E.emoji}</div><h1>Era Complete!</h1><div class="big">${stars(s)}</div>
  <div class="stats"><div>❌ Mistakes: ${st.mistakes}</div><div>🔎 Peeks: ${st.peeks}</div><div>⭐ Best: ${stars(best)}</div></div>
  <div class="lesson"><b>Did you know?</b><br>• ${E.facts[0]}<br>• ${E.facts[1]}</div>
  <div class="lesson" style="font-size:13px">${sorted.map(e=>`${e.e} <b>${e.d}</b> — ${e.t}`).join('<br>')}</div>
  <button id="next">${last?'🏠 Warp home!':'🌀 Warp to '+ERAS[li+1].name}</button><br><button class="sec" id="again">🔁 Replay</button><button class="sec" id="tlv">🕰️ Timeline</button><button class="sec" id="lv">🗺️ Eras</button>`);
  $('next').onclick=()=>last?goHome():playEra(li+1,true);$('again').onclick=()=>playEra(li,false);$('tlv').onclick=()=>masterTimeline();$('lv').onclick=()=>levelSelect()},1100)}
function goHome(){const from=E.year;startWarp(from,2026,'Warping home to today…',()=>{screen='menu';setHud(false);buildLevel(N-1);
 showCard(`<div class="emo">🏠⏳</div><h1>You Made It Home!</h1><p class="sub">You repaired your time machine by visiting all ${N} eras — from the dinosaurs to the Moon!</p><div class="big">★ ${totalStars()} / ${N*3}</div><div class="lesson">History is a story that is still being written — and YOU are part of it. What will people learn about <b>your</b> time someday?</div><button id="tlv">🕰️ See your Timeline</button><button class="sec" id="lv">🗺️ Eras</button>`);
 sfx.win();$('tlv').onclick=()=>masterTimeline();$('lv').onclick=()=>levelSelect()})}
// ===== Screens =====
function playEra(i,doWarp,force){if(!force&&!unlocked(i))return;hideCard();hideDlg();const from=screen==='play'||screen==='menu'?E.year:2026;
 const go=()=>{buildLevel(i);screen='play';setHud(true);const o=camTarget();camera.position.set(o[0],o[1],10+o[2]);camLook.set(-Math.sin(camYaw),1,10-Math.cos(camYaw));eraTune(i);
  showCard(`<div class="emo">${E.emoji}</div><h1>${E.name}</h1><p class="sub" style="color:#7b3fe4;font-weight:900">${E.when}</p><div class="lesson">🎯 <b>Your mission</b><br>1. Find 3 hidden ⚙️ time-machine parts and answer their questions.<br>2. Talk to <b>${E.npc.name}</b> ${E.npc.face} and complete the challenge.<br>3. Power the ⚡ time machine by putting history in order!</div><button id="go">Let's explore! ▶</button>`,{light:1});$('go').onclick=()=>{hideCard();showMsg('Drag to look around; walk with WASD / arrows or tap the ground.')}};
 if(doWarp)startWarp(from,ERAS[i].year,`Warping to ${ERAS[i].name}…`,go);else go()}
function levelSelect(){if(screen==='play'&&!st.done)screen='play';hideDlg();
 showCard(`<button class="x" id="lx">✕</button><h2>🗺️ Choose an Era</h2><p class="sub">⭐ ${totalStars()} / ${N*3} stars</p><div class="levels">${ERAS.map((e,i)=>`<button class="lv" data-i="${i}" ${unlocked(i)?'':'disabled'}><div class="n">${unlocked(i)?e.emoji:'🔒'}</div>${e.name}<small>${e.short}</small><div class="s">${stars(prog.stars[i])}</div></button>`).join('')}</div><button class="sec" id="tlv">🕰️ Timeline</button>`,{wide:1});
 document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>playEra(+b.dataset.i,true));$('tlv').onclick=()=>masterTimeline();$('lx').onclick=()=>screen==='play'?hideCard():titleScreen()}
function masterTimeline(){hideDlg();const order=ERAS.map((e,i)=>i).sort((a,b)=>ERAS[a].year-ERAS[b].year);let h='',ceDone=false;
 order.forEach((i,k)=>{const e=ERAS[i];if(!ceDone&&e.year>0){h+=`<div class="ce">Year 1 CE</div>`;ceDone=true}const done=prog.stars[i]>0,un=unlocked(i);
  h+=`<div class="node ${done?'done':un?'':'lock'}"><div class="dot">${done||un?e.emoji:'❓'}</div><div class="lbl">${done||un?e.name:'???'}</div><div class="yr">${e.short}</div><div class="st">${done?stars(prog.stars[i]):''}</div></div>`;
  if(i===0)h+=`<div class="gap">〰️<br>66 million years go by!<br>〰️</div>`});
 showCard(`<button class="x" id="mx">✕</button><h2>🕰️ Master Timeline</h2><p class="sub">Every era you complete lights up on the timeline. (${prog.stars.filter(s=>s>0).length} of ${N} restored)</p><div class="mt">${h}</div>
 <div class="lesson"><b>BCE and CE:</b> We count years from a starting point called <b>year 1</b>. Years after it are <b>CE</b> (“Common Era”) and count UP: 80 CE, 1969 CE, 2026 CE… Years before it are <b>BCE</b> (“Before the Common Era”) and count DOWN toward year 1, so <b>2560 BCE is older than 432 BCE</b>. There is no year 0 — 1 BCE is followed right away by 1 CE!<br>Notice: the eras weren't played in date order. The Maya built Chichen Itza at about the same time the Vikings were sailing!</div><button id="mok">OK</button>`,{wide:1});
 const back=()=>{if(screen==='play')hideCard();else titleScreen()};$('mx').onclick=$('mok').onclick=back}
function titleScreen(){screen='title';setHud(false);hideDlg();const next=Math.max(0,prog.stars.findIndex(s=>s===0));const nx=prog.stars.every(s=>s>0)?0:next;
 if(!world.children.length)buildLevel(nx);
 showCard(`<div class="emo">⏳🌀</div><h1>Time Traveler</h1><p class="sub">Oh no! Your time machine broke, and its parts are scattered across history! Explore <b>${N} eras</b> — from dinosaurs to the Moon landing — find the missing parts, help the people (and dinosaurs!) you meet, and put history in order to warp home.</p>
 <div class="stats"><div>⭐ ${totalStars()} / ${N*3}</div><div>🗺️ ${prog.stars.filter(s=>s>0).length} / ${N} eras</div></div>
 <button id="play">▶ ${totalStars()?'Continue':'Play'}</button><button class="sec" id="lvls">🗺️ Eras</button><button class="sec" id="tlv">🕰️ Timeline</button>
 <p class="sub" style="font-size:13px">Drag to look around · WASD / arrows or tap to walk · E to talk · R to reset view</p>`);
 $('play').onclick=()=>{ac();sfx.click();playEra(nx,true)};$('lvls').onclick=()=>{ac();levelSelect()};$('tlv').onclick=()=>{ac();masterTimeline()}}
// ===== Top buttons =====
$('hintBtn').onclick=()=>{if(screen!=='play'||uiOpen())return;sfx.click();let tx,tz,what;
 const remainingOdd=oddObjs.filter(o=>!o.userData.gone&&o.userData.item.bad);
 if(st.chActive&&remainingOdd.length){const o=remainingOdd[0];tx=o.position.x;tz=o.position.z;what='Something out of time is under the beam — tap it!'}
 else{const left=E.parts.map((p,k)=>({...p,k})).filter(p=>!st.parts[p.k]).sort((a,b)=>distTo(a.x,a.z)-distTo(b.x,b.z));
  if(left.length&&(st.npcDone||st.talked)){tx=left[0].x;tz=left[0].z;what='A ⚙️ part is hidden where the golden beam shines!'}
  else if(!st.npcDone){tx=E.npc.x;tz=E.npc.z;what=`Go talk to ${E.npc.name}!`}
  else if(left.length){tx=left[0].x;tz=left[0].z;what='A ⚙️ part is hidden where the golden beam shines!'}
  else{tx=tm.position.x;tz=tm.position.z;what='Walk to the glowing time machine!'}}
 if(beam)world.remove(beam);beam=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,40,12,1,true),new THREE.MeshBasicMaterial({color:0xffd166,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));beam.position.set(tx,20,tz);beam.userData.t=7;world.add(beam);showMsg('💡 '+what)};
$('tlBtn').onclick=()=>{sfx.click();if(uiOpen()&&screen==='play')return;masterTimeline()};
$('lvlBtn').onclick=()=>{sfx.click();if(uiOpen()&&screen==='play'&&!$('overlay').classList.contains('hide'))return;levelSelect()};
const sndLbl=()=>$('sndBtn').textContent=muted?'🔇':'🔊';sndLbl();
$('sndBtn').onclick=()=>{muted=!muted;localStorage.setItem(MUTE_KEY,muted?'1':'0');sndLbl();if(!muted)sfx.click()};
const gfxLbl=()=>$('gfxBtn').textContent='⚙️ '+{auto:'Auto',high:'High',low:'Low'}[gfxMode]+(gfxMode==='auto'?(gfxLow?' (Low)':' (High)'):'');
function applyGfx(){gfxLow=isLow();renderer.setPixelRatio(gfxLow?1:Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=!gfxLow;sun.castShadow=!gfxLow;
 scene.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=!gfxLow;[].concat(o.material).forEach(m=>m&&(m.needsUpdate=true))}});gfxLbl();resize()}
$('gfxBtn').onclick=()=>{gfxMode={auto:'high',high:'low',low:'auto'}[gfxMode];localStorage.setItem(GFX_KEY,gfxMode);applyGfx();showMsg(`Graphics: ${gfxMode.toUpperCase()}${gfxLow?' — no shadows (fewer props from the next era)':' — shadows on'}`)};
gfxLbl();
addEventListener('resize',resize);resize();
// ===== Test API =====
window.__game={
 get state(){return {screen,level:li,era:E.id,parts:st.parts.slice(),talked:st.talked,npcDone:st.npcDone,chActive:st.chActive,challenge:ch&&ch.type,oddFound:st.oddFound,done:st.done,mistakes:st.mistakes,peeks:st.peeks,stars:prog.stars.slice(),uiOpen:uiOpen(),cardText:$('overlay').classList.contains('hide')?'':$('card').innerText,dialog:$('dlg').style.display==='flex'?$('dlgText').textContent:'',gfx:gfxMode,gfxLow,warping:!!warp,player:{x:player.position.x,z:player.position.z}}},
 get level(){return li},eras:ERAS,
 loadLevel(i,warpIn){playEra(i,!!warpIn,true)},
 finishWarp(){if(warp)warp.t=warp.dur},
 closeCard(){const b=document.querySelector('#card #go,#card #ok,#card #collect');if(b)b.click();else hideCard()},
 teleport(x,z){player.position.set(x,0,z);target=null;pending=null},
 partPositions:()=>E.parts.map(p=>({x:p.x,z:p.z})),npcPosition:()=>({x:E.npc.x,z:E.npc.z}),machinePosition:()=>({x:tm.position.x,z:tm.position.z}),
 blocked:(x,z)=>blockedAt(x,z,.5),
 reachable(){const step=.5,R=E.R,key=(i,j)=>i+','+j,seen=new Set(),q=[[0,20]];seen.add(key(0,20));const ok=(i,j)=>{const x=i*step,z=j*step;return Math.hypot(x,z)<=R&&!blockedAt(x,z,.5)};
  while(q.length){const [i,j]=q.shift();for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){const n=[i+a,j+b];const k=key(...n);if(!seen.has(k)&&ok(...n)){seen.add(k);q.push(n)}}}
  const near=(x,z,r)=>{for(const k of seen){const [i,j]=k.split(',').map(Number);if(Math.hypot(i*step-x,j*step-z)<r)return true}return false};
  return {parts:E.parts.map(p=>near(p.x,p.z,1.6)),npc:near(E.npc.x,E.npc.z,2.8),tm:near(tm.position.x,tm.position.z,3.3)}},
 collectPart(k){const p=E.parts[k];player.position.set(p.x+.8,0,p.z+.8);target=null;pending=null},
 correctAnswer(){if(!curQ)return -1;return curQ.order.indexOf(0)},
 answer(idx){const b=document.querySelectorAll('.choices .ch')[idx];if(b)b.click();return !!b},
 answerCorrect(){const i=this.correctAnswer();if(i<0)return false;this.answer(i);const c=$('collect');if(c)c.click();return true},
 talk(){player.position.set(E.npc.x+1.6,0,E.npc.z+1.2);target=null;talk()},
 skipDialog(){let n=0;while($('dlg').style.display==='flex'&&n++<20)nextLine()},
 anachronisms:()=>oddObjs.map((o,k)=>({k,emoji:o.userData.item.e,bad:!!o.userData.item.bad,gone:!!o.userData.gone,x:o.position.x,z:o.position.z})),
 clickAnachronism(k){clickOdd(k)},
 screenPosOf(k){const o=oddObjs[k];if(!o)return null;const v=o.position.clone().project(camera);return {x:(v.x+1)/2*innerWidth,y:(1-v.y)/2*innerHeight}},
 solveChallenge(){if(!ch&&!st.chActive)return false;const C=E.ch;
  if(st.chActive){oddObjs.forEach((o,k)=>{if(o.userData.item.bad)clickOdd(k)});return true}
  if(C.type==='decode'){const run=()=>{if(!ch)return;const b=[...document.querySelectorAll('#opts .ch')].find(x=>+x.dataset.v===ch.ans);b&&b.click()};run();return 'async'}
  if(C.type==='match'){C.pairs.forEach((p,i)=>{document.querySelector(`.mi[data-s="L"][data-i="${i}"]`).click();document.querySelector(`.mi[data-s="R"][data-i="${i}"]`).click()});return true}
  if(C.type==='pick'){document.querySelectorAll('.pk').forEach(b=>{if(E.ch.items[+b.dataset.i].ok)b.click()});return true}
  if(C.type==='tf'){const it=C.items[ch.step];const b=document.querySelector(`#tfb .ch[data-v="${it.a?1:0}"]`);b&&b.click();const nx=$('nx');nx&&nx.click();return 'async'}},
 useMachine(){player.position.set(tm.position.x-1.5,0,tm.position.z-2);target=null;useTM()},
 timelineOrder:()=>correctOrder(),currentTimelineOrder:()=>tl?tl.order.slice():null,
 setTimelineOrder(o){if(!tl)return false;tl.order=o.slice();renderTimeline();return true},
 checkTimeline(){if(tl)checkTimeline()},
 hint(){$('hintBtn').click()},
 masterTimeline(){masterTimeline()},levelSelect(){levelSelect()},title(){titleScreen()},
 resetProgress(){prog={stars:Array(N).fill(0)};saveProg()}
};
// ===== Boot =====
buildLevel(Math.max(0,prog.stars.findIndex(s=>s===0)));titleScreen();requestAnimationFrame(loop);
</script></body></html>
