function starsText(n){return '★'.repeat(n)+'☆'.repeat(3-n)}function showMenu(){state='menu';clearItems();$('hud').style.display='none';card(`<h1>Spelling <span>Snake</span> 🐍</h1><p>Listen, find the letters, and grow your garden friend!</p><p><b>Choose a level to play</b></p><div class="levels">${levels.map((l,i)=>`<button class="lvbtn ${i===lastLevel?'last':''}" data-level="${i}"><span class="num">${i+1} ${l.icon}</span><span class="nm">${l.name}</span><span class="stars">${starsText(stars[i]||0)}</span></button>`).join('')}</div><p>Eat letters in order. Watch out for walls, rocks and your tail!</p><button class="secondary gfx" data-act="gfx">${gfxLabel()}</button>`,true)}
function pause(){if(state==='playing'||state==='celebrating'){const was=state;state='paused';window.__resumeState=was;try{window.speechSynthesis.cancel()}catch{}card(`<h2>⏸ Taking a little break</h2><p>Your snake will be right here!</p><div class="btnrow"><button data-act="resume">Resume</button><button class="secondary" data-act="levels">Levels</button></div><button class="secondary gfx" data-act="gfx">${gfxLabel()}</button>`)}else if(state==='paused'){state=window.__resumeState||'playing';if(state==='celebrating')celebrationUntil=performance.now()+500;$('overlay').classList.remove('show');accum=0;previous=performance.now()}}
function finishLevel(){state='complete';const earned=mistakes===0?3:mistakes<=4?2:1;stars[level]=Math.max(stars[level]||0,earned);try{localStorage.setItem('spellingSnakeStars',JSON.stringify(stars))}catch{}$('progress').firstElementChild.style.width='100%';card(`<h1>Wonderful! 🎉</h1><h2>${levels[level].name} complete</h2><div class="starsBig">${starsText(earned)}</div><p><b>${score} points</b> · ${mistakes} ${mistakes===1?'mistake':'mistakes'}</p><p>Words you spelled:</p><div class="review">${levels[level].words.map(w=>`<span>${w[0]}</span>`).join('')}</div><div class="btnrow"><button data-act="retry">Retry</button>${level<levels.length-1?'<button data-act="next">Next ➜</button>':''}<button class="secondary" data-act="levels">Levels</button></div>`)}
function showGameOver(){card(`<h1>Nice try! 🐍</h1><h2>Every letter is practice.</h2><p>You earned <b>${score} points</b>. Ready for another adventure?</p><div class="btnrow"><button data-act="retry">Try again</button><button class="secondary" data-act="levels">Levels</button></div>`)}
$('card').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.level!==undefined){startLevel(+b.dataset.level);return}switch(b.dataset.act){case'levels':showMenu();break;case'retry':startLevel(level);break;case'next':startLevel(level+1);break;case'resume':pause();break;case'gfx':setGfx(['auto','high','low'][(['auto','high','low'].indexOf(gfxMode)+1)%3]);b.textContent=gfxLabel();break}});$('pauseBtn').onclick=pause;$('hear').onclick=()=>{if(state==='playing'||state==='celebrating')speak()};$('peek').onclick=()=>{if(state!=='playing')return;score=Math.max(0,score-10);peekUntil=performance.now()+1500;updateHUD()};$('touchpad').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(b){e.preventDefault();setDirection(b.dataset.dir)}});
addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};const k=e.key.length===1?e.key.toLowerCase():e.key;if(map[k]){e.preventDefault();setDirection(map[k])}else if(k==='p'||k==='Escape'){e.preventDefault();pause()}else if(k==='h'&&(state==='playing'||state==='celebrating'))speak()});let swipe=null;renderer.domElement.addEventListener('pointerdown',e=>{swipe={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',e=>{if(!swipe)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;swipe=null;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;setDirection(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});
function resize(){const aspect=innerWidth/innerHeight;const size=aspect<1?15:12;camera.left=-size*aspect;camera.right=size*aspect;camera.top=size;camera.bottom=-size;if(aspect<1){camera.left=-10;camera.right=10;camera.top=10/aspect;camera.bottom=-10/aspect}camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-previous)/1000||0);previous=now;if(state==='playing'){accum+=dt;const interval=Math.max(.15,.29-wordIndex*.012);if(accum>=interval){accum-=interval;step()}const t=clamp(accum/interval,0,1);snakeGroup.children.forEach((g,i)=>{const s=snake[i],prev=snake[i+1]||s;if(!s)return;g.position.x=prev.x+(s.x-prev.x)*t;g.position.z=prev.z+(s.z-prev.z)*t;if(i===0)g.rotation.y=Math.atan2(-direction.z,direction.x)});if(peekUntil&&now>=peekUntil){peekUntil=0;updateHUD()}}else if(state==='celebrating'&&now>=celebrationUntil)advanceWord();for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.life-=dt;e.m.position.x+=e.vx*dt;e.m.position.y+=e.vy*dt;e.m.position.z+=e.vz*dt;e.vy-=5*dt;if(e.life<=0){scene.remove(e.m);e.m.geometry.dispose();e.m.material.dispose();effects.splice(i,1)}}if(toastUntil&&now>toastUntil){$('toast').style.opacity=0;toastUntil=0}if(gfxMode==='auto'&&!gfxLow&&state==='playing'&&!document.hidden){if(!fpsStart)fpsStart=now;fpsFrames++;if(now-fpsStart>=4000){if(fpsFrames*1000/(now-fpsStart)<40){applyGfx(true);showToast('Graphics lowered for smoother play')}fpsStart=now;fpsFrames=0}}else{fpsFrames=0;fpsStart=0}renderer.render(scene,camera)}
setGfx(gfxMode);resize();showMenu();requestAnimationFrame(frame);
window.__game={get state(){return state},get level(){return level},get wordIndex(){return wordIndex},get currentWord(){return currentWord()},get collectedIndex(){return collected},get items(){return items.map(({x,z,letter})=>({x,z,letter}))},get snake(){return snake.map(s=>({...s}))},get head(){return {...snake[0]}},get direction(){return {...direction}},get lives(){return lives},get score(){return score},get mistakes(){return mistakes},get obstacles(){return obstacles.map(([x,z])=>({x,z}))},get gfx(){return {mode:gfxMode,low:gfxLow,weakHw}},setDirection,step,startLevel,setGfx,advanceCelebration:advanceWord};
</script>
